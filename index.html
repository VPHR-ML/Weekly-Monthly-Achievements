  const fy=fyStart(cur);
  for (const d of S.config.departments){ const list=kp[d.id]; if(!list) continue; const doc={deptId:d.id,fy,kpis:list.map((k,i)=>({id:'k'+i,name:k[0],unit:k[1],agg:k[2]})),months:{},quarters:{}};
    doc.weeks={}; const REASONS=['Vendor delay','Approval pending with authority','Short-staffed this month','Site access delayed','Waiting on client inputs'];
    months.forEach(m=>{ if (m===cur){ const mi=monthInfo(m); for(let n=1;n<=todayWeek(m);n++){ doc.weeks[`${m}-W${n}`]={}; list.forEach((k,i)=>{ const t=k[2]==='avg'?k[3]:Math.round(k[3]*mi.weeks[n-1].days/mi.dim*10)/10; const a=Math.round(t*(0.6+r()*0.55)*10)/10; doc.weeks[`${m}-W${n}`]['k'+i]={t:String(t),a:String(k[2]==='avg'?Math.min(a,100):a),r: a/t<0.8?REASONS[Math.floor(r()*REASONS.length)]:''}; }); } return; }
      doc.months[m]={}; list.forEach((k,i)=>{ const t=k[3]; const a=Math.round(t*(0.65+r()*0.5)*10)/10; doc.months[m]['k'+i]={t:String(t),a:String(k[2]==='avg'?Math.min(a,100):a),r: a/t<0.8?REASONS[Math.floor(r()*REASONS.length)]:''}; }); });
    await Store.set('dept',deptDocId(fy,d.id),doc); S.dept[deptDocId(fy,d.id)]=doc; }
  const wkPer=`${cur}-W${cw}`, qid=quarterOf(cur).id; const vj={role:'cluster',id:'vijay',name:'Vijaykumar Bhalekar'}, hr={role:'hod',id:'hr-admin',name:'HR & Admin'};
  const notes=[['weekly',wkPer,vj,{good:[{name:'Marvel site team',professional:'Wing C slab cast two days ahead of plan'},{name:'Sneha Kulkarni',personal:'Blessed with a baby girl'}],appr:[{name:'Midas City QS team',text:'Closed all pending contractor bills before the deadline'}],bott:[{area:'Marvel Wing D',issue:'Work on hold for revised structural drawings',support:'Design & Development',status:'Open',from:'Sep Week 2'},{area:'Midas City infra',issue:'RMC supply delayed twice this week',support:'Purchase',status:'In progress'}]}],
    ['quarterly',qid,hr,{good:[{name:'HR team',professional:'Closed 22 of 24 open positions'}],appr:[{name:'Payroll team',text:'Zero payroll errors for the quarter'}],oe:[{name:'HR & Admin',initiative:'Digital joining kit',output:'Joining time cut from 3 days to 1',expected:'Full paperless onboarding by next quarter'}],bott:[{area:'Hiring',issue:'Site engineer offers declined on salary',support:'CEO approval on revised band',status:'Open'}]}],
    ['monthly',cur,hr,{good:[{name:'Accounts team',professional:'GST filing closed three days early'}],appr:[{name:'Store team',text:'Zero stock-outs at Marvel and Midas City'}],bott:[{area:'Purchase',issue:'Cement vendor rates up 6%',support:'CEO decision on second vendor',status:'Open'}]}]];
  for (const [type,per,u,body] of notes){ const id=noteId(type,per,u); const doc={type,period:per,author:u,updatedAt:now,...body}; S.meetings[id]=doc; await Store.set('meetings',id,doc); }
  const staff=[['Rahul Deshmukh','Project Manager','Projects','Marvel','','Marvel',145000],['Sneha Kulkarni','Site Engineer','Projects','Marvel','','Marvel',62000],['Amit Jadhav','Project Manager','Projects','Miraya','','Miraya',138000],['Pooja Shinde','Site Engineer','Projects','Miraya','','Miraya',58000],['Kiran Pawar','Project Manager','Projects','Midas City','','Midas City',150000],['Nilesh Gaikwad','Site Engineer','Projects','Midas City','','Midas City',60000],['Suresh More','Project In-charge','Projects','Mithila-01','','Mithila-01',98000],['Ganesh Bhosale','Project In-charge','Projects','Shyni Gold','','Shyni Gold',95000],['Vaishali Patil','Project Manager','Projects','Niyoshi Park','','Niyoshi Park',132000],['Prakash Thorat','QS Engineer','Contracts','','Marvel, Midas City, Mithila-01','Head Office',85000],['Meera Joshi','MEP Lead','MEP','','Marvel:40, Miraya:30, Niyoshi Park:30','Head Office',120000],['Sachin Wagh','Safety Officer','EHS','','All','Head Office',70000],['Rohit Chavan','Planning Engineer','Planning','','Miraya, Shyni Gold','Head Office',76000]]
    .map((x,i)=>({id:'s'+(i+1)+'-'+slug(x[0]),name:x[0],designation:x[1],department:x[2],dedicated:x[3],shared:x[4],location:x[5],gross:x[6],ctcMonth:Math.round(x[6]*1.12),ctcYear:Math.round(x[6]*1.12*12)}));
  S.staff=staff; await Store.set('app','staff',{rows:staff, demo:true});
  toast('Sample figures loaded'); render();
}
async function wipeAll(){
  const ok = await ask('Remove all figures, notes and staff?','Every weekly entry, approval, department figure, meeting note, incentive override and the staff list will be deleted. Projects, departments and logins stay.','Remove everything',true); if(!ok) return;
  for (const [col,key] of [['entries','entries'],['incentives','inc'],['meetings','meetings'],['dept','dept']]) for (const id of Object.keys(S[key])) await Store.del(col,id);
  await Store.del('app','staff'); S.entries={}; S.inc={}; S.meetings={}; S.dept={}; S.staff=[]; toast('All figures removed'); render();
}

/* ---------- events ---------- */
const leaveOk = async()=> !S.dirty || await ask('Leave without saving?','Your changes on this page are not saved yet.','Leave');
document.addEventListener('click', async ev=>{
  const b = ev.target.closest('[data-act]'); if(!b || !$('#app').contains(b)) return; const a=b.dataset.act; const c=S.config;
  switch(a){
    case 'nav': if (b.dataset.v==='meeting'){ openMeeting('weekly'); break; } if (b.dataset.v==='mmeeting'){ openMeeting('monthly'); break; } if (b.dataset.v==='qmeeting'){ openMeeting('quarterly'); break; } if(!(await leaveOk())) break; S.dirty=false; S.view=b.dataset.v; render(); window.scrollTo(0,0); break;
    case 'logout': S.user=null; S.dirty=false; try{ sessionStorage.removeItem('mip:user'); }catch(e){} render(); break;
    case 'appr': S.approvedOnly = b.dataset.v==='1'; render(); break;
    case 'tab': if(!(await leaveOk())) break; S.dirty=false; S[b.dataset.k]=b.dataset.v; render(); break;
    case 'refresh': await loadAll(); render(); toast('Figures refreshed'); break;
    case 'meet': openMeeting('weekly'); break;
    case 'week': if(!(await leaveOk())) break; S.dirty=false; S.week=+b.dataset.v; render(); break;
    case 'saveDraft': persistEntry('draft'); break;
    case 'submitWeek': persistEntry('submit'); break;
    case 'reopen': { const e=JSON.parse(JSON.stringify(getEntry(S.month,b.dataset.p))); const W=e.weeks[S.week]; if(!W) break; W.status='draft'; (W.log||=[]).push({at:new Date().toISOString(),by:'CEO',action:'reopened'}); await saveEntry(e); toast('Reopened as draft'); render(); break; }
    case 'decide': decide(b.dataset.k, b.dataset.d); break;
    case 'saveNotes': saveNotes(); break;
    case 'saveTargets': saveTargets(); break;
    case 'openProj': S.projectSel=b.dataset.p; S.view='project'; render(); window.scrollTo(0,0); break;
    case 'finalise': finaliseMonth(); break;
    case 'unfinalise': if (await ask('Reopen the calculation?','The finalised snapshot and every change made to it will be discarded.','Reopen',true)){ const d={...(S.inc[S.month]||{})}; delete d.finalized; S.inc[S.month]=d; await Store.set('incentives',S.month,d); toast('Reopened'); render(); } break;
    case 'delKpi': { const fy=S.deptPeriod==='quarterly'?qInfo(S.quarter).fy:fyStart(S.month); const doc=getDeptDoc(S.deptSel,fy); const k=(doc.kpis||[]).find(x=>x.id===b.dataset.k); if (k && await ask(`Delete "${k.name}"?`,'The KPI and its figures for this financial year are removed.','Delete',true)) saveDeptDoc(fy,S.deptSel,d=>{ d.kpis=d.kpis.filter(x=>x.id!==k.id); }); break; }
    case 'openDept': S.deptSel=b.dataset.d; S.view='targets'; render(); window.scrollTo(0,0); break;
    case 'exportSummary': exportSummary(); break;
    case 'exportIncentive': exportIncentive(); break;
    case 'template': downloadTemplate(); break;
    case 'delStaff': S.staff = S.staff.filter(r=>r.id!==b.dataset.id); await Store.set('app','staff',{rows:S.staff}); render(); break;
    case 'clearStaff': if (await ask('Remove all staff?','The incentive register will be empty until you upload again.','Remove all',true)){ S.staff=[]; await Store.set('app','staff',{rows:[]}); render(); } break;
    case 'addProject': { const name=$('#npName').value.trim(); if(!name) return toast('Enter a project name'); if (c.projects.some(p=>slug(p.name)===slug(name))) return toast('A project with that name exists');
      let id=slug(name); while(c.projects.some(p=>p.id===id)) id+='-2';
      const bl = $('#npBld').value.split(',').map(s=>s.trim()).filter(Boolean).map(n=>B(id,n)); if ($('#npInfra').checked) bl.push(B(id,'Infra','Infra'));
      c.projects.push({id,name,clusterId:$('#npCl').value,password:'123',buildings:bl}); await saveConfig(`${name} created · login "${name}", password 123`); render(); break; }
    case 'delProject': { const p=proj(b.dataset.p); if (await ask(`Delete ${p.name}?`,'The project, its buildings and its login are removed. Past figures stay in storage but no longer show.','Delete project',true)){ c.projects=c.projects.filter(x=>x.id!==p.id); await saveConfig('Project deleted'); render(); } break; }
    case 'addBld': { const p=proj(b.dataset.p); const name=$('#nb-'+p.id).value.trim(); if(!name) return toast('Enter a building name'); let nb=B(p.id,name,$('#nk-'+p.id).value); while(p.buildings.some(x=>x.id===nb.id)) nb.id+='-2'; p.buildings.push(nb); await saveConfig(`${name} added to ${p.name}`); render(); break; }
    case 'delBld': { const p=proj(b.dataset.p); const bl=p.buildings.find(x=>x.id===b.dataset.b); if (await ask(`Remove ${bl.name} from ${p.name}?`,'Its figures will no longer count in totals.','Remove',true)){ p.buildings=p.buildings.filter(x=>x.id!==bl.id); await saveConfig('Building removed'); render(); } break; }
    case 'addCluster': { const name=$('#ncName').value.trim(); if(!name) return toast('Enter a name'); let id=slug(name); while(c.clusters.some(x=>x.id===id)) id+='-2'; c.clusters.push({id,name,password:'123'}); await saveConfig(`${name} added · password 123`); render(); break; }
    case 'delCluster': { const k=cluster(b.dataset.c); if (await ask(`Remove ${k.name}?`,'Their projects move to CEO approval until you assign another cluster head.','Remove',true)){ c.clusters=c.clusters.filter(x=>x.id!==k.id); c.projects.forEach(p=>{ if(p.clusterId===k.id) p.clusterId=''; }); await saveConfig('Cluster head removed'); render(); } break; }
    case 'addDept': { const name=$('#ndName').value.trim(); if(!name) return toast('Enter a department name'); if (c.departments.some(d=>slug(d.name)===slug(name))) return toast('That department exists'); let id=slug(name); while(c.departments.some(d=>d.id===id)) id+='-2'; c.departments.push({id,name,password:'123'}); await saveConfig(`${name} added · login "${name}", password 123`); render(); break; }
    case 'delDept': { const d=dept(b.dataset.d); if (await ask(`Delete ${d.name}?`,'The department and its HOD login are removed. Its past figures stay in storage but no longer show.','Delete',true)){ c.departments=c.departments.filter(x=>x.id!==d.id); await saveConfig('Department deleted'); render(); } break; }
    case 'addSlab': { const mx=Math.max(...c.settings.slabs.map(s=>+s.min)); c.settings.slabs.push({min:Math.min(mx+20,150),pct:+c.settings.slabs[c.settings.slabs.length-1].pct+5}); await saveConfig('Slab added'); render(); break; }
    case 'delSlab': c.settings.slabs.splice(+b.dataset.i,1); await saveConfig('Slab removed'); render(); break;
    case 'demo': loadDemo(); break;
    case 'wipe': wipeAll(); break;
  }
});
document.addEventListener('change', async ev=>{
  const t=ev.target; const k=t.dataset.chg; if(!k || !$('#app').contains(t)) return; const c=S.config; const v=t.value;
  const P = ()=>proj(t.dataset.p), Bd = ()=>proj(t.dataset.p).buildings.find(x=>x.id===t.dataset.b), K=()=>cluster(t.dataset.c), D=()=>dept(t.dataset.d);
  switch(k){
    case 'month': if (!(await leaveOk())){ t.value=S.month; break; } S.dirty=false; S.month=v; S.week=todayWeek(v); render(); break;
    case 'quarter': if (!(await leaveOk())){ t.value=S.quarter; break; } S.dirty=false; S.quarter=v; render(); break;
    case 'projectSel': if (!(await leaveOk())){ t.value=S.projectSel; break; } S.dirty=false; S.projectSel=v; render(); break;
    case 'deptSel': if (!(await leaveOk())){ t.value=S.deptSel; break; } S.dirty=false; S.deptSel=v; render(); break;
    case 'upload': if (t.files[0]) uploadStaff(t.files[0]); t.value=''; break;
    case 'finAmt': updateFinal(t.dataset.id,'final',v); break;
    case 'finReason': updateFinal(t.dataset.id,'reason',v); break;
    case 'pName': if(!v.trim()) return render(); P().name=v.trim(); await saveConfig('Renamed'); break;
    case 'pCl': P().clusterId=v; await saveConfig('Cluster head updated'); render(); break;
    case 'pPw': if(!v.trim()) return render(); P().password=v.trim(); await saveConfig('Password updated'); break;
    case 'bName': if(!v.trim()) return render(); Bd().name=v.trim(); await saveConfig('Renamed'); break;
    case 'bKind': Bd().kind=v; await saveConfig('Updated'); break;
    case 'cName': if(!v.trim()) return render(); K().name=v.trim(); await saveConfig('Renamed'); render(); break;
    case 'cPw': if(!v.trim()) return render(); K().password=v.trim(); await saveConfig('Password updated'); break;
    case 'dName': if(!v.trim()) return render(); D().name=v.trim(); await saveConfig('Renamed'); break;
    case 'dPw': if(!v.trim()) return render(); D().password=v.trim(); await saveConfig('Password updated'); break;
    case 'thr': { const n=num(v); if(n<=0||n>200) return render(); c.settings.threshold=n; if (c.settings.slabs.length===1) c.settings.slabs[0].min=n; await saveConfig('Incentive line updated'); render(); break; }
    case 'base': c.settings.base=v; await saveConfig('Updated'); render(); break;
    case 'unit': c.settings.unit=v.trim()||'₹ Lakhs'; await saveConfig('Units updated'); break;
    case 'slabMin': c.settings.slabs[+t.dataset.i].min=num(v); await saveConfig('Slab updated'); render(); break;
    case 'slabPct': c.settings.slabs[+t.dataset.i].pct=num(v); await saveConfig('Slab updated'); render(); break;
    case 'ceoPw': if(!v.trim()) return render(); c.ceo.password=v.trim(); await saveConfig('CEO password updated'); break;
    case 'coName': if(!v.trim()) return render(); c.coordinator.name=v.trim(); await saveConfig('Renamed'); break;
    case 'coPw': if(!v.trim()) return render(); c.coordinator.password=v.trim(); await saveConfig('Password updated'); break;
  }
});
document.addEventListener('input', ev=>{ const t=ev.target; if (t.dataset.in){ S.dirty=true; updateEntryCalc(); return; } if (!t.dataset.nf) return; S.dirty=true;
  if (t.dataset.k && ['t','a','qt','qa'].includes(t.dataset.f)){ const tr=t.closest('tr'); const g=f=>{ const i=tr.querySelector(`[data-f="${f}"]`); return i ? (i.value!==''?i.value:i.placeholder) : ''; };
    const q = t.dataset.f.startsWith('q'); const T=g(q?'qt':'t'), A=g(q?'qa':'a'); const cells=tr.querySelectorAll('td.num'); const cell=cells[cells.length-1];
    if (cell) cell.innerHTML = has(T)&&has(A)&&num(T)>0 ? pctChip(num(A)/num(T)*100) : '<span class="faint">–</span>'; } });

/* ---------- boot ---------- */
(async function boot(){
  $('#app').innerHTML = `<div class="login-wrap"><div class="muted">Loading…</div></div>`;
  await Store.init(); try{ await loadAll(); }catch(e){ S.config = normConfig(null); }
  S.month = todayMonth(); S.week = todayWeek(S.month); S.quarter = quarterOf(S.month).id;
  try{ const u=JSON.parse(sessionStorage.getItem('mip:user')||'null'); if(u && recordFor(u.role,u.id)) signIn(u.role,u.id); }catch(e){}
  let t=null;
  Store.watch(()=>{ clearTimeout(t); t=setTimeout(()=>{ if (!S.user) return renderLogin(); if (S.dirty) return; if (document.querySelector('#dlg[open]')) return; if (S.meet) return renderMeet(); if (document.activeElement && document.activeElement.matches('input,select,textarea') && $('#app').contains(document.activeElement)) return; render(); }, 250); });
  render();
})();
