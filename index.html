<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mangalam · Weekly Achievement & Incentive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#ECEEF0; --surface:#FFFFFF; --surface-2:#F6F7F8; --ink:#22262A; --ink-2:#59626B; --ink-3:#8A939B;
  --line:#D6DBE0; --line-2:#E7EAED;
  --brand:#D7262F; --steel:#35546E; --steel-2:#9DB2C4;
  --good:#067647; --good-bg:#E4F4EB; --watch:#8F5B00; --watch-bg:#FBF1D9; --risk:#B42318; --risk-bg:#FCE8E6;
  --info-bg:#E8EEF4;
  --r-lg:14px; --r-md:10px; --r-sm:6px;
  --font:"Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15181B; --surface:#1E2226; --surface-2:#252A2F; --ink:#E9ECEF; --ink-2:#A9B2BA; --ink-3:#7B858E;
    --line:#343A40; --line-2:#2B3035; --steel:#8FB0CC; --steel-2:#4F6A80;
    --good:#4ADE9A; --good-bg:#16352A; --watch:#E5B454; --watch-bg:#3A2F16; --risk:#FF8A80; --risk-bg:#3E1F1D; --info-bg:#22303C;
  }
}
:root[data-theme="dark"]{
  --bg:#15181B; --surface:#1E2226; --surface-2:#252A2F; --ink:#E9ECEF; --ink-2:#A9B2BA; --ink-3:#7B858E;
  --line:#343A40; --line-2:#2B3035; --steel:#8FB0CC; --steel-2:#4F6A80;
  --good:#4ADE9A; --good-bg:#16352A; --watch:#E5B454; --watch-bg:#3A2F16; --risk:#FF8A80; --risk-bg:#3E1F1D; --info-bg:#22303C;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
h1,h2,h3{font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.15}
h1{font-size:27px;font-weight:500;letter-spacing:-.02em} h2{font-size:18px;font-weight:500} h3{font-size:15px;font-weight:500}
p{margin:0}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:13px}
.num{text-align:right;white-space:nowrap}
/* logo */
.logo{display:inline-flex;flex-direction:column;line-height:1;user-select:none}
.logo b{font-size:23px;font-weight:600;letter-spacing:-.02em;color:var(--ink);position:relative}
.logo b i{display:inline-block;width:7px;height:7px;background:var(--brand);border-radius:50%;margin-left:2px;vertical-align:baseline}
.logo span{font-size:10px;letter-spacing:.32em;color:var(--ink-2);margin-top:4px;font-weight:500}
.logo img{display:block;height:auto;width:150px;max-width:100%;border-radius:4px}
.login .logo img{width:220px}
.meet-top .logo img{width:120px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo img{background:#fff;padding:4px 6px}}
:root[data-theme="dark"] .logo img{background:#fff;padding:4px 6px}
/* login */
.login-wrap{min-height:100%;display:grid;place-items:center;padding:24px}
.login{width:min(430px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:32px}
.login h1{margin:28px 0 6px}
.login .field{margin-top:16px}
/* shell */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;height:100dvh}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:var(--r-sm);color:var(--ink-2);font-weight:400;display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--surface-2);color:var(--ink);font-weight:500;box-shadow:inset 3px 0 0 var(--brand)}
.nav button:focus-visible{outline:2px solid var(--steel)}
.badge{font-size:11px;font-weight:600;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--brand);color:#fff;display:inline-grid;place-items:center}
.who{margin-top:auto;border-top:1px solid var(--line-2);padding-top:14px;font-size:13px}
.who strong{display:block;font-size:14px}
.main{min-width:0;padding:26px 32px 60px}
.topbar{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.topbar .ctx{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.store-tag{font-size:12px;color:var(--ink-3)}
/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.danger{color:var(--risk);border-color:color-mix(in srgb,var(--risk) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input.in,select.in,textarea.in{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 10px;min-width:0}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--steel);outline-offset:0;border-color:transparent}
input.cell{width:100%;min-width:90px;text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:6px 8px}
input.cell:disabled{background:var(--surface-2);color:var(--ink-2);border-color:var(--line-2)}
label.lbl{display:block;font-size:13px;color:var(--ink-2);margin-bottom:5px;font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:7px 12px;font-size:13px;font-weight:500;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--surface)}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px}
.panel + .panel,.stack > * + *{margin-top:18px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
.grid2 > .panel + .panel{margin-top:0}
.grid2 > *{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;margin-bottom:18px}
.kpi{padding:14px 18px;border-right:1px solid var(--line-2)}
.kpi:last-child{border-right:0}
.kpi .v{font-size:24px;font-weight:400;letter-spacing:-.02em}
.kpi .l{font-size:12.5px;color:var(--ink-2)}
.kpi .s{font-size:12px;color:var(--ink-3)}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:var(--r-md)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:500;color:var(--ink-2);text-align:left;font-size:12.5px;background:var(--surface-2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.total td{font-weight:500;background:var(--surface-2)}
tr.grand td{font-weight:500;background:var(--ink);color:var(--surface)}
tr.proj-row td:first-child{font-weight:500}
.pct{font-weight:500;padding:2px 8px;border-radius:5px;display:inline-block;min-width:58px;text-align:right}
.pct.good{color:var(--good);background:var(--good-bg)} .pct.watch{color:var(--watch);background:var(--watch-bg)} .pct.risk{color:var(--risk);background:var(--risk-bg)} .pct.none{color:var(--ink-3)}
.chip{font-size:12px;font-weight:500;padding:2px 9px;border-radius:20px;display:inline-block;white-space:nowrap}
.chip.draft{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.chip.submitted{background:var(--info-bg);color:var(--steel)}
.chip.approved{background:var(--good-bg);color:var(--good)}
.chip.returned{background:var(--risk-bg);color:var(--risk)}
.chip.blank{color:var(--ink-3)}
/* incentive line board (signature) */
.board{display:flex;flex-direction:column;gap:6px}
.lane{display:grid;grid-template-columns:150px 1fr 150px;gap:16px;align-items:center;padding:8px 0}
.lane + .lane{border-top:1px dashed var(--line-2)}
.lane .name{font-weight:500;font-size:16px}
.lane .name small{display:block;font-weight:500;font-size:12px;color:var(--ink-3);}
.track{position:relative;height:30px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--surface-2) 0 calc(100%/12 - 1px),var(--line-2) calc(100%/12 - 1px) calc(100%/12))}
.track .fill{position:absolute;left:0;top:5px;bottom:5px;border-radius:3px;background:var(--steel);max-width:100%}
.track .fill.good{background:var(--good)} .track .fill.watch{background:#C08A1E} .track .fill.risk{background:#C2493D}
.track .exp{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--ink-2);z-index:1}
.st{font-size:12px;padding:2px 8px;border-radius:20px;white-space:nowrap}
.st.open{background:var(--risk-bg);color:var(--risk)} .st.prog{background:var(--watch-bg);color:var(--watch)} .st.done{background:var(--good-bg);color:var(--good)}
.track .proj{position:absolute;top:1px;bottom:1px;width:0;border-left:2px dashed var(--ink-2)}
.track .proj::after{content:"";position:absolute;top:-4px;left:-5px;border:4px solid transparent;border-top-color:var(--ink-2)}
.track .line{position:absolute;top:-8px;bottom:-8px;width:2px;background:var(--brand);z-index:2}
.track .line::before{content:"";position:absolute;top:-6px;left:-5px;width:12px;height:12px;border-radius:50%;background:var(--brand)}
.lane .fig{text-align:right}
.lane .fig b{font-size:21px;font-weight:400}
.lane .fig span{display:block;font-size:12px;color:var(--ink-2)}
.axis{display:grid;grid-template-columns:150px 1fr 150px;gap:16px;font-size:11px;color:var(--ink-3)}
.axis .ticks{position:relative;height:14px}
.axis .ticks span{position:absolute;transform:translateX(-50%)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:12px}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
.hero-num{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hero-num .big{font-size:64px;font-weight:300;line-height:1;letter-spacing:-.03em}
/* insights */
.ins{display:grid;grid-template-columns:4px 1fr;gap:14px;padding:12px 0}
.ins + .ins{border-top:1px solid var(--line-2)}
.ins .bar{border-radius:2px;background:var(--steel)}
.ins.good .bar{background:var(--good)} .ins.watch .bar{background:var(--watch)} .ins.risk .bar{background:var(--risk)}
.ins h3{margin-bottom:3px}
.ins p{color:var(--ink-2);font-size:14px}
.ins .act{margin-top:5px;font-size:13.5px;color:var(--ink)}
.ins .act b{font-weight:600}
/* charts */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:520px}
.chart text{fill:var(--ink-2);font-family:var(--font);font-size:11px}
.heat td.h{text-align:center;font-weight:500;font-size:13px}
/* week tabs */
.weeks{display:flex;gap:8px;flex-wrap:wrap}
.weeks{align-items:flex-start}
.weeks button{all:unset;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:9px 14px;min-width:104px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;box-sizing:border-box}
.weeks button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.weeks button b{display:block;font-size:15px;font-weight:500}
.weeks button span{font-size:12px;color:var(--ink-2)}
.banner{border-radius:var(--r-md);padding:12px 16px;margin-bottom:14px;font-size:14px;background:var(--info-bg)}
.banner.risk{background:var(--risk-bg)} .banner.good{background:var(--good-bg)} .banner.watch{background:var(--watch-bg)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2)}
.empty h3{color:var(--ink);margin-bottom:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.cards > .panel + .panel{margin-top:0}
.bld-list{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.bld{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:center}
.kind{font-size:12px;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:var(--r-md);font-weight:500;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.18)}
dialog{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);color:var(--ink);padding:22px;width:min(520px,94vw)}
dialog::backdrop{background:rgba(20,24,28,.45)}
/* meeting */
.meet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.meet-top{display:flex;align-items:center;gap:16px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surface)}
.meet-body{flex:1;overflow:auto;padding:28px 40px}
.meet-body .inner{max-width:1320px;margin:0 auto}
.meet .dots{display:flex;gap:6px}
.meet .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.meet .dots i.on{background:var(--brand)}
.meet h1{font-size:40px}
.meet .kpi .v{font-size:30px}
/* executive summary & project cards */
.exec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:18px}
.exec p.lead{font-size:18px;line-height:1.5;font-weight:400}
.exec .facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.exec .facts span{font-size:13px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:20px;padding:3px 11px;color:var(--ink-2)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;background:var(--surface);display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--line)}
.pcard.good{border-top-color:var(--good)} .pcard.watch{border-top-color:#C08A1E} .pcard.risk{border-top-color:var(--risk)}
.pcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pcard .top h3{font-size:16px}
.pcard .pc{font-size:34px;font-weight:300;letter-spacing:-.02em;line-height:1.1}
.pcard .mini{position:relative;height:6px;background:var(--surface-2);border-radius:3px}
.pcard .mini i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--steel)}
.pcard.good .mini i{background:var(--good)} .pcard.watch .mini i{background:#C08A1E} .pcard.risk .mini i{background:var(--risk)}
.pcard .mini b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--brand)}
.pcard .ln{font-size:13.5px;color:var(--ink-2)} .pcard .ln b{font-weight:500;color:var(--ink)}
.badge-st{font-size:12px;padding:3px 10px;border-radius:20px;white-space:nowrap;font-weight:500}
.badge-st.good{background:var(--good-bg);color:var(--good)} .badge-st.watch{background:var(--watch-bg);color:var(--watch)} .badge-st.risk{background:var(--risk-bg);color:var(--risk)} .badge-st.none{background:var(--surface-2);color:var(--ink-3)}
details.more{margin-top:18px} details.more > summary{cursor:pointer;list-style:none;padding:14px 22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);font-weight:500}
details.more[open] > summary{border-radius:var(--r-lg) var(--r-lg) 0 0}
details.more > summary::after{content:"Show";float:right;color:var(--ink-3);font-weight:400;font-size:13px} details.more[open] > summary::after{content:"Hide"}
details.more > .inner{border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r-lg) var(--r-lg);padding:18px 22px;background:var(--surface)}
details.more > .inner > .panel{border:0;padding:0}
.guide h2{margin:22px 0 8px} .guide h3{margin:16px 0 6px} .guide p,.guide li{color:var(--ink-2);font-size:14.5px;line-height:1.65} .guide ul,.guide ol{padding-left:20px;margin:6px 0}
.guide .formula{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:12px 14px;font-size:13.5px;color:var(--ink);margin:8px 0;white-space:pre-wrap}
.guide .note{border-left:3px solid var(--steel);padding:6px 12px;background:var(--info-bg);border-radius:0 6px 6px 0;margin:10px 0}
/* notes sheets */
.sheet td{padding:4px 6px}
.sheet td.idx{width:34px;color:var(--ink-3);text-align:center;font-size:12.5px}
.sheet input.in{width:100%;border-color:var(--line-2)}
.sheet th:first-child{text-align:center}
.pct.req{background:transparent;border:1px dashed var(--line);color:var(--ink-2)}
.tabs{display:inline-flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brand);font-weight:500}
.group-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:4px 0 8px}
.meet-empty{padding:30px;text-align:center;color:var(--ink-3)}
@media (max-width:1020px){.grid2{grid-template-columns:1fr}.grid2 > .panel + .panel{margin-top:18px}}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:12px;border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;flex-wrap:wrap;gap:4px;order:3;width:100%}
  .nav button{padding:6px 10px;font-size:14px}
  .who{margin:0 0 0 auto;border:0;padding:0;text-align:right}
  .main{padding:18px 14px 50px}
  .lane,.axis{grid-template-columns:96px 1fr 88px;gap:10px}
  .lane .fig b{font-size:18px}
  .hero-num .big{font-size:48px}
  .meet-body{padding:18px}
}
@media (prefers-reduced-motion:no-preference){.track .fill{transition:width .5s ease}}
@media print{.side,.topbar .ctx{display:none}.shell{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>

/* ---------- storage: Claude artifact db → Vercel /api/store (Supabase) → this browser ---------- */
const COLS = ['entries','incentives','meetings','dept'];
const Store = {
  mode:'local', db:null, unsubs:[],
  async init(){
    if (window.claude && typeof window.claude.use === 'function'){
      try{ const db = await Promise.race([window.claude.use('db'), new Promise(r=>setTimeout(()=>r(null),8000))]); if (db){ this.db = db; this.mode = 'cloud'; return; } }catch(e){}
    }
    if (location.protocol.startsWith('http')){
      try{ const r = await fetch('api/store?col=app&id=config',{cache:'no-store'}); if (r.ok && (r.headers.get('content-type')||'').includes('json')){ this.mode='api'; return; } }catch(e){}
    }
    this.mode='local';
  },
  lk(col,id){ return 'mip:'+col+':'+id },
  async get(col,id){
    if (this.mode==='cloud'){ const s = await this.db.doc(col+'/'+id).get(); return s.exists ? JSON.parse(JSON.stringify(s.data())) : null; }
    if (this.mode==='api'){ const r = await fetch(`api/store?col=${encodeURIComponent(col)}&id=${encodeURIComponent(id)}`,{cache:'no-store'}); const j = await r.json(); return j.data ?? null; }
    try{ const v = localStorage.getItem(this.lk(col,id)); return v ? JSON.parse(v) : null; }catch(e){ return null; }
  },
  async set(col,id,data){
    if (this.mode==='cloud'){ return this.db.doc(col+'/'+id).set(data); }
    if (this.mode==='api'){ const r = await fetch('api/store',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({col,id,data})}); if(!r.ok){ let m=''; try{ m=(await r.json()).error }catch(e){} throw new Error(m||('Save failed ('+r.status+')')); } return; }
    try{ localStorage.setItem(this.lk(col,id), JSON.stringify(data)); }catch(e){ throw new Error('This browser blocked local storage'); }
  },
  async del(col,id){
    if (this.mode==='cloud') return this.db.doc(col+'/'+id).delete();
    if (this.mode==='api'){ await fetch(`api/store?col=${encodeURIComponent(col)}&id=${encodeURIComponent(id)}`,{method:'DELETE'}); return; }
    try{ localStorage.removeItem(this.lk(col,id)); }catch(e){}
  },
  async list(col){
    if (this.mode==='cloud'){ const s = await this.db.collection(col).get(); return s.docs.map(d=>({id:d.id, data:JSON.parse(JSON.stringify(d.data()))})); }
    if (this.mode==='api'){ const r = await fetch(`api/store?col=${encodeURIComponent(col)}`,{cache:'no-store'}); const j = await r.json(); return j.docs || []; }
    const out=[]; try{ for (let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if (k.startsWith('mip:'+col+':')) out.push({id:k.slice(col.length+5), data:JSON.parse(localStorage.getItem(k))}); } }catch(e){}
    return out;
  },
  watch(onChange){
    if (this.mode==='cloud'){
      const safe = fn => (snap)=>{ try{ fn(snap) }catch(e){ console.error(e) } };
      const plain = d => JSON.parse(JSON.stringify(d));
      this.unsubs.push(this.db.doc('app/config').onSnapshot(safe(s=>{ if(s.exists){ S.config = normConfig(plain(s.data())); onChange(); } })));
      this.unsubs.push(this.db.doc('app/staff').onSnapshot(safe(s=>{ S.staff = s.exists ? (plain(s.data()).rows||[]) : []; onChange(); })));
      const map = {entries:'entries', incentives:'inc', meetings:'meetings', dept:'dept'};
      Object.entries(map).forEach(([col,key])=>{ this.unsubs.push(this.db.collection(col).onSnapshot(safe(s=>{ const o={}; s.docs.forEach(d=>o[d.id]=plain(d.data())); S[key]=o; onChange(); }))); });
    } else if (this.mode==='api'){
      setInterval(async()=>{ if (S.dirty || document.hidden) return; await loadAll(); onChange(); }, 45000);
    }
  }
};
function normConfig(c){
  const d = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  c = c || d;
  c.settings = Object.assign({}, d.settings, c.settings||{});
  if (!Array.isArray(c.settings.slabs) || !c.settings.slabs.length) c.settings.slabs = d.settings.slabs;
  c.ceo = Object.assign({}, d.ceo, c.ceo||{});
  c.coordinator = Object.assign({}, d.coordinator, c.coordinator||{});
  c.clusters = c.clusters || []; c.projects = c.projects || [];
  if (!Array.isArray(c.departments)) c.departments = d.departments;
  c.projects.forEach(p=>{ p.buildings = p.buildings||[]; });
  return c;
}

async function loadAll(){
  let cfg = await Store.get('app','config');
  if (!cfg){ cfg = JSON.parse(JSON.stringify(DEFAULT_CONFIG)); try{ await Store.set('app','config',cfg); }catch(e){} }
  S.config = normConfig(cfg);
  if (!cfg.departments || !cfg.coordinator){ try{ await Store.set('app','config',S.config); }catch(e){} }
  const st = await Store.get('app','staff'); S.staff = st ? (st.rows||[]) : [];
  const [en,inc,mt,dp] = await Promise.all(COLS.map(c=>Store.list(c)));
  const toMap = arr => { const o={}; arr.forEach(x=>o[x.id]=x.data); return o; };
  S.entries = toMap(en); S.inc = toMap(inc); S.meetings = toMap(mt); S.dept = toMap(dp);
}

/* ---------- calendar ----------
   Weeks follow the real calendar (Monday to Sunday). A stub of 1–2 days at the start or end of the
   month joins the neighbouring week, so a month has 4 or 5 weeks. */
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MNL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const _mi = {};
function monthInfo(month){
  if (_mi[month]) return _mi[month];
  const [y,m] = month.split('-').map(Number); const dim = new Date(y,m,0).getDate();
  const r=[]; let s=1;
  while (s<=dim){ const dow = new Date(y,m-1,s).getDay(); const e = Math.min(dim, s + (dow===0?0:7-dow)); r.push([s,e]); s=e+1; }
  if (r.length>1 && r[0][1]-r[0][0]+1<=2){ r[1][0]=r[0][0]; r.shift(); }
  if (r.length>1 && r[r.length-1][1]-r[r.length-1][0]+1<=2){ r[r.length-2][1]=r[r.length-1][1]; r.pop(); }
  const weeks = r.map((x,i)=>({n:i+1,start:x[0],end:x[1],days:x[1]-x[0]+1}));
  return _mi[month] = {y,m,dim,weeks,N:weeks.length,label:MNL[m-1]+' '+y, short:MN[m-1]+' '+String(y).slice(2), name:MNL[m-1]};
}
function fyStart(month){ const [y,m]=month.split('-').map(Number); return m>=4?y:y-1; }
function fyMonths(month){ const fy=fyStart(month); return Array.from({length:12},(_,i)=>{ const mm=(3+i)%12+1, yy= i<9?fy:fy+1; return yy+'-'+String(mm).padStart(2,'0'); }); }
function fyLabel(month){ const fy=fyStart(month); return 'FY'+fy+'-'+String(fy+1).slice(2); }
function quarterOf(month){ const fy=fyStart(month); const [,m]=month.split('-').map(Number); const q = m>=4&&m<=6?1:m>=7&&m<=9?2:m>=10?3:4; return qInfo(fy+'-Q'+q); }
function qInfo(qid){ const [fy,qq]=qid.split('-Q').map(Number); const all=fyMonths(fy+'-04'); const months=all.slice((qq-1)*3,qq*3);
  return {id:qid, fy, q:qq, months, label:`Q${qq} ${fyLabel(fy+'-04')}`, span:`${MN[+months[0].slice(5)-1]}–${MN[+months[2].slice(5)-1]}`}; }
function todayMonth(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function weekOfDay(month, day){ const w = monthInfo(month).weeks.find(w=>day>=w.start&&day<=w.end); return w?w.n:1; }
function todayWeek(month){ return month===todayMonth() ? weekOfDay(month, new Date().getDate()) : monthInfo(month).N; }

/* ---------- numbers ---------- */
const nf = new Intl.NumberFormat('en-IN',{maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
const fmt = v => (v==null||isNaN(v)) ? '–' : nf.format(v);
const rs = v => (v==null||isNaN(v)) ? '–' : '₹'+nf0.format(Math.round(v));
const pctS = v => (v==null||!isFinite(v)) ? '–' : (Math.round(v*10)/10).toFixed(1)+'%';
const thr = () => +S.config.settings.threshold || 80;
const tone = p => (p==null||!isFinite(p)) ? 'none' : p>=thr() ? 'good' : p>=thr()*0.75 ? 'watch' : 'risk';
const pctChip = p => `<span class="pct ${tone(p)}">${pctS(p)}</span>`;
/* Within a month, colour against where the 80% line should be by that weekend, not against 80% itself:

const paceExp = (end, dim) => thr()*end/dim;
const paceTone = (p, end, dim) => { if (p==null||!isFinite(p)||!end) return tone(p); const e=paceExp(end,dim); return p>=e ? 'good' : p>=e*0.85 ? 'watch' : 'risk'; };
const paceChip = (p, end, dim) => `<span class="pct ${paceTone(p,end,dim)}" title="${end?'80% pace by day '+end+': '+pctS(paceExp(end,dim)):''}">${pctS(p)}</span>`;
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v??'').replace(/,/g,'')); return isFinite(n)?n:0; };
const has = v => v!=null && v!=='' && isFinite(parseFloat(String(v).replace(/,/g,'')));

/* ---------- lookups ---------- */
const proj = id => S.config.projects.find(p=>p.id===id);
const cluster = id => S.config.clusters.find(c=>c.id===id);
const dept = id => S.config.departments.find(d=>d.id===id);
const entryId = (month,pid) => month+'_'+pid;
function getEntry(month,pid){ return S.entries[entryId(month,pid)] || {month, projectId:pid, targets:{}, weeks:{}}; }
const wk = (e,n) => (e.weeks && e.weeks[n]) || {vals:{}, status:'draft'};
function visibleProjects(){
  const u=S.user; if(!u) return [];
  if (u.role==='ceo' || u.role==='coord') return S.config.projects;
  if (u.role==='cluster') return S.config.projects.filter(p=>p.clusterId===u.id);

}
function includeStatus(st, mode){
  if (mode==='approved') return st==='approved';
  if (mode==='submitted') return st==='approved'||st==='submitted';
  return true;
}
function viewMode(){ if (!S.user) return 'approved'; if (S.user.role==='project'||S.user.role==='coord') return 'all'; return S.approvedOnly ? 'approved' : 'submitted'; }

/* ---------- core calculation: cumulative achievement at each weekend ---------- */
function calcProject(pid, month, mode){
  const p = proj(pid); const mi = monthInfo(month); const e = getEntry(month,pid);
  const blds = p.buildings.map(b=>({id:b.id,name:b.name,kind:b.kind,target:num(e.targets?.[b.id]),weeks:[],mtd:0,raw:0,remark:'',remarkWeek:null}));
  const weeks = mi.weeks.map(w=>{
    const W = wk(e,w.n); const hasData = Object.keys(W.vals||{}).length>0; const inc = hasData && includeStatus(W.status||'draft', mode);
    let cum=0;
    blds.forEach(b=>{ const v = W.vals?.[b.id];
      if (v){ b.raw = has(v.cum) ? num(v.cum) : b.raw + num(v.a); if (v.r){ b.remark=v.r; b.remarkWeek=w.n; } }   // older entries stored weekly figures
      b.weeks.push({cum: inc ? b.raw : null}); if (inc){ b.mtd = b.raw; cum += b.raw; } });
    return {...w, status:W.status||'draft', hasData, included:inc, cum: inc?cum:null, by:W.submittedBy||'', note:W.note||''};
  });
  const target = blds.reduce((s,b)=>s+b.target,0);
  let lastIdx=-1, prevCum=0;
  weeks.forEach((w,i)=>{ if (w.included){ w.gain = w.cum - prevCum; prevCum = w.cum; lastIdx=i; } w.cumPct = w.included && target>0 ? w.cum/target*100 : null; });
  const mtd = lastIdx>=0 ? weeks[lastIdx].cum : 0;
  blds.forEach(b=>{ b.pct = b.target>0 && lastIdx>=0 ? b.mtd/b.target*100 : null; b.share = mtd>0 ? b.mtd/mtd*100 : 0; });
  const last = lastIdx>=0 ? weeks[lastIdx] : null; const remWeeks = mi.N-(lastIdx+1);
  // Days, not weeks, carry the arithmetic: weeks in a month are 3 to 9 days long.
  const daysDone = last ? last.end : 0, remDays = mi.dim - daysDone;
  const need80 = Math.max(0, target*thr()/100 - mtd), need100 = Math.max(0, target - mtd);
  const perDay80 = remDays>0 ? need80/remDays : null;
  const perWeek80 = perDay80!=null ? perDay80*7 : null;                       // per full 7-day week
  const req = weeks.map((w,i)=> i<=lastIdx || target<=0 ? null : mtd + perDay80*(w.end-daysDone));
  const add = weeks.map((w,i)=> i<=lastIdx || target<=0 ? null : perDay80*w.days);
  const gains = weeks.filter(w=>w.included).map(w=>w.gain);
  const expNow = daysDone ? thr()*daysDone/mi.dim : null;                         // where the 80% line should be by the last reported weekend
  return {p, pid, month, mi, e, blds, weeks, target, mtd, pct: target>0&&last ? mtd/target*100 : null, last, lastIdx, remWeeks, daysDone, remDays,
    need80, need100, perWeek80, perWeek80Pct: perWeek80!=null && target>0 ? perWeek80/target*100 : null, req, add, expNow, closed: remDays===0,
    reqPct: req.map(v=>v==null||!target?null:v/target*100),
    avgWeekA: daysDone ? mtd/daysDone*7 : null, lastGain: gains.length?gains[gains.length-1]:null, prevGain: gains.length>1?gains[gains.length-2]:null,
    lastDays: last?last.days:null, prevDays: lastIdx>0?weeks[lastIdx-1].days:null};
}
function calcPortfolio(pids, month, mode){
  const list = pids.map(id=>calcProject(id,month,mode)); const mi = monthInfo(month);
  const target = list.reduce((s,c)=>s+c.target,0); const withData = list.filter(c=>c.last);
  const mtd = list.reduce((s,c)=>s+c.mtd,0); const lastIdx = Math.max(-1,...list.map(c=>c.lastIdx));
  const weeks = mi.weeks.map((w,i)=>{ let a=0,inc=false; list.forEach(c=>{ const x=c.weeks[i]; if(x.included){a+=x.cum;inc=true;} }); return {n:w.n,cum:inc?a:null}; });
  // Incentive is earned project by project, so a project above the line cannot offset one below it.
  const below = withData.filter(c=>c.target>0 && c.pct<thr());
  const need80 = list.reduce((s,c)=>s+(c.target>0?c.need80:0),0);
  const daysDone = Math.max(0,...list.map(c=>c.daysDone)); const remWeeks = mi.N-(lastIdx+1);
  return {list, target, mtd, pct: target>0&&withData.length ? mtd/target*100 : null, lastIdx, weeks, withData, mi, need80, below, remWeeks, daysDone,
    expNow: daysDone ? thr()*daysDone/mi.dim : null};
}
function calcQuarter(pids, qid){
  const Q = qInfo(qid);
  const rows = pids.map(pid=>{ const ms = Q.months.map(m=>{ const c=calcProject(pid,m,'approved'); return {m, target:c.target, ach:c.mtd, pct:c.pct, reported:!!c.last}; });
    const t = ms.reduce((s,x)=>s+x.target,0), a = ms.reduce((s,x)=>s+x.ach,0); return {p:proj(pid), ms, target:t, ach:a, pct: t>0 && ms.some(x=>x.reported) ? a/t*100 : null}; });
  const t = rows.reduce((s,r)=>s+r.target,0), a = rows.reduce((s,r)=>s+r.ach,0);
  return {Q, rows, target:t, ach:a, pct: t>0 && rows.some(r=>r.pct!=null) ? a/t*100 : null};
}
function slabPct(p){ if (p==null) return 0; let best=0; S.config.settings.slabs.slice().sort((a,b)=>a.min-b.min).forEach(s=>{ if (p>=+s.min) best=+s.pct; }); return best; }
function pendingFor(user){
  const out=[]; if (!user || !['ceo','cluster'].includes(user.role)) return out;
  Object.values(S.entries).forEach(e=>{ const p=proj(e.projectId); if(!p) return;
    if (user.role==='cluster' && p.clusterId!==user.id) return;
    Object.keys(e.weeks||{}).forEach(n=>{ if (e.weeks[n].status==='submitted') out.push({month:e.month,pid:p.id,n:+n,at:e.weeks[n].submittedAt}); }); });
  return out.sort((a,b)=>(a.month+String(a.n).padStart(2,'0')).localeCompare(b.month+String(b.n).padStart(2,'0')));
}

/* ---------- departments: weekly -> monthly -> quarterly ----------
   Each level adds up from the level below (Sum or Average per KPI). A figure typed at a level replaces the added-up figure. */
const deptDocId = (fy,did) => fy+'_'+did;
function getDeptDoc(did, fy){
  const d = S.dept[deptDocId(fy,did)]; if (d) return d;
  const prev = S.dept[deptDocId(fy-1,did)];
  return {deptId:did, fy, kpis: prev ? JSON.parse(JSON.stringify(prev.kpis||[])) : [], weeks:{}, months:{}, quarters:{}};
}
const aggV = (arr, agg) => { const v=arr.filter(x=>x!=null); if(!v.length) return null; const s=v.reduce((a,b)=>a+b,0); return agg==='avg' ? s/v.length : s; };
function kpiEff(direct, from){
  direct = direct || {}; const t = has(direct.t)?num(direct.t):from.t, a = has(direct.a)?num(direct.a):from.a;
  return {t, a, pct: t>0 && a!=null ? a/t*100 : null, r: direct.r||'', direct: has(direct.t)||has(direct.a), fromT:from.t, fromA:from.a, rawT:direct.t??'', rawA:direct.a??'', rawR:direct.r||''};
}
function deptSummary(d, kpis){ const ps=kpis.map(k=>k.pct).filter(v=>v!=null);
  return {d, kpis, pct: ps.length ? ps.reduce((s,x)=>s+x,0)/ps.length : null, filled: kpis.some(k=>k.t!=null||k.a!=null), behind: kpis.filter(k=>k.pct!=null && k.pct<thr())}; }
function deptWeek(did, month, n){
  const d = getDeptDoc(did, fyStart(month)); const wv = (d.weeks||{})[`${month}-W${n}`]||{};
  return deptSummary(d, (d.kpis||[]).map(k=>({...k, ...kpiEff(wv[k.id], {t:null,a:null})})));
}
function deptMonth(did, month){
  const d = getDeptDoc(did, fyStart(month)); const mi=monthInfo(month); const mv=(d.months||{})[month]||{};
  return deptSummary(d, (d.kpis||[]).map(k=>{
    const ws = mi.weeks.map(w=>{ const v=(d.weeks||{})[`${month}-W${w.n}`]?.[k.id]||{}; return {n:w.n, t:has(v.t)?num(v.t):null, a:has(v.a)?num(v.a):null, r:v.r||''}; });
    const wr = ws.filter(x=>x.r).map(x=>x.r).pop()||'';
    const eff = kpiEff(mv[k.id], {t:aggV(ws.map(x=>x.t),k.agg), a:aggV(ws.map(x=>x.a),k.agg)});
    return {...k, ws, ...eff, r: eff.r || wr};
  }));
}
function deptQuarter(did, qid){
  const Q = qInfo(qid); const d = getDeptDoc(did, Q.fy); const qv = (d.quarters||{})[qid]||{};
  const months = Q.months.map(m=>deptMonth(did,m));
  const r = deptSummary(d, (d.kpis||[]).map(k=>{
    const ms = months.map((mm,i)=>{ const x=mm.kpis.find(z=>z.id===k.id)||{}; return {m:Q.months[i], t:x.t??null, a:x.a??null, r:x.r||''}; });
    const mr = ms.filter(x=>x.r).map(x=>x.r).pop()||'';
    const eff = kpiEff(qv[k.id], {t:aggV(ms.map(x=>x.t),k.agg), a:aggV(ms.map(x=>x.a),k.agg)});
    return {...k, ms, ...eff, r: eff.r || mr};
  }));
  return {Q, ...r};
}
function deptPeriod(did, per){ return per==='weekly' ? deptWeek(did,S.month,S.week) : per==='monthly' ? deptMonth(did,S.month) : deptQuarter(did,S.quarter); }

/* ---------- meeting notes (good news, appreciation, bottlenecks, operational excellence) ---------- */
const authorKey = u => u.role+'-'+u.id;
const NOTE_PRE = {weekly:'wk_', monthly:'mo_', quarterly:'q_'};

/* ---------- charts (plain SVG) ---------- */
function lineChart({series, labels, ref, height=270}){
  const W=760,H=height,L=40,R=120,T=16,Bt=28, iw=W-L-R, ih=H-T-Bt;
  let maxV = Math.max(110, ...series.flatMap(s=>s.points.concat(s.req||[]).filter(v=>v!=null)));
  maxV = Math.ceil(maxV/25)*25;
  const x = i => L + i*(iw/(labels.length-1)); const y = v => T+ih - Math.min(v,maxV)/maxV*ih;
  let g='';
  for (let v=0; v<=maxV; v+=25){ g+=`<line x1="${L}" x2="${L+iw}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-2)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}%</text>`; }
  labels.forEach((l,i)=> g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`);
  if (ref!=null) g+=`<line x1="${L}" x2="${L+iw}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--brand)" stroke-width="1.2"/><circle cx="${L}" cy="${y(ref)}" r="3.5" fill="var(--brand)"/><text x="${L+8}" y="${y(ref)-6}" style="fill:var(--brand)">Incentive line ${ref}%</text>`;
  const ends=[];
  series.forEach(s=>{
    const pts = s.points.map((v,i)=>v==null?null:[x(i),y(v)]); let d=''; let lastI=-1;
    pts.forEach((p,i)=>{ if(!p) return; d += (d?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); lastI=i; });
    if (s.req){ let rd=''; s.req.forEach((v,i)=>{ if(v==null) return; rd += (rd?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1); }); if (rd) g+=`<path d="${rd}" fill="none" stroke="var(--brand)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".75"/>`; }
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"/>`;
    pts.forEach(p=>{ if(p) g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="${s.color}"/>`; });
    if (lastI>=0) ends.push({y:pts[lastI][1],x:pts[lastI][0],c:s.color,t:s.name+' '+Math.round(s.points[lastI])+'%'});
  });
  ends.sort((a,b)=>a.y-b.y); let prevY=-99; ends.forEach(e=>{ const yy=Math.max(e.y+4, prevY+13); prevY=yy; g+=`<text x="${L+iw+8}" y="${yy}" style="fill:${e.c}">${esc(e.t)}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative achievement by week">${g}</svg></div>`;
}
function barChart({groups, ref, pctMode=false, height=240, colors=['var(--steel-2)','var(--steel)']}){
  const W=760,H=height,L=pctMode?40:64,R=16,T=18,Bt=30, iw=W-L-R, ih=H-T-Bt;
  let maxV = Math.max(pctMode?110:1, ...groups.flatMap(g=>g.values.filter(v=>v!=null)));
  const step = pctMode?25:niceStep(maxV/4); maxV = Math.ceil(maxV/step)*step || 1;
  const y = v => T+ih - Math.min(v,maxV)/maxV*ih; const gw = iw/Math.max(1,groups.length); const nb = groups[0]?.values.length||1; const bw = Math.min(34,(gw*0.7)/nb);
  let g='';
  for (let v=0; v<=maxV+1e-9; v+=step){ g+=`<line x1="${L}" x2="${L+iw}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-2)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${pctMode?Math.round(v)+'%':shortNum(v)}</text>`; }
  groups.forEach((gr,i)=>{
    const cx = L + gw*i + gw/2; const x0 = cx - bw*nb/2;
    gr.values.forEach((v,j)=>{ if (v==null) return; const col = typeof colors[j]==='function'?colors[j](v):colors[j]; g+=`<rect x="${x0+j*bw+1}" y="${y(Math.max(v,0))}" width="${bw-2}" height="${Math.max(0,ih-(y(Math.max(v,0))-T))}" rx="2" fill="${col}"><title>${esc(gr.label)}: ${pctMode?pctS(v):fmt(v)}</title></rect>`;
      if (pctMode) g+=`<text x="${x0+j*bw+bw/2}" y="${y(Math.max(v,0))-5}" text-anchor="middle" style="fill:var(--ink)">${Math.round(v)}%</text>`; });
    g+=`<text x="${cx}" y="${H-9}" text-anchor="middle">${esc(gr.label)}</text>`;
  });
  if (ref!=null) g+=`<line x1="${L}" x2="${L+iw}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--brand)" stroke-width="1.2" stroke-dasharray="4 3"/>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">${g}</svg></div>`;
}
function niceStep(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function shortNum(v){ return v>=1e7?(v/1e7).toFixed(1)+'Cr':v>=1e5?(v/1e5).toFixed(1)+'L':v>=1e3?(v/1e3).toFixed(1)+'k':String(Math.round(v*100)/100); }
const weekLabels = mi => ['Start', ...mi.weeks.map(w=>'Week '+w.n)];

function monthClosed(month){ const mi=monthInfo(month); return S.config.projects.every(p=>{ const e=getEntry(month,p.id); return !p.buildings.some(b=>num(e.targets?.[b.id])>0) || wk(e,mi.N).status==='approved'; }); }
/* ---------- reporting discipline: who has and hasn't sent what ---------- */

/* ---------- the incentive line board ---------- */
function board(pf){

  <p class="faint small" style="margin-top:6px">Bar colour compares each project with its pace mark: green on or ahead of pace, amber slightly behind, red well behind.</p>`;
}

/* ---------- what is needed to reach the incentive line: plain language ---------- */
function projStatus(c){
  if (!c.last || c.target<=0) return {k:'none', l:'No figures'};
  if (c.pct>=thr()) return {k:'good', l:'Achieved'};
  if (c.closed) return {k:'risk', l:'Missed'};
  if (c.pct>=paceExp(c.daysDone,c.mi.dim)) return {k:'good', l:'On track'};
  if (c.avgWeekA>0 && c.perWeek80<=c.avgWeekA*1.5) return {k:'watch', l:'Needs push'};
  return {k:'risk', l:'At risk'};
}
const stBadge = st => `<span class="badge-st ${st.k}">${st.l}</span>`;
function remainingWeeks(c){ return c.weeks.map((w,i)=>({w, add:c.add[i]})).filter((x,i)=>i>c.lastIdx); }
function needText(c, short=false){
  const U=S.config.settings.unit;

const isYes = v => /^(y|yes|true|1|✓)$/i.test(String(v??'').trim());

function allocation(r, month){
  if (!isNo(r.dedicated)){
    const name = isYes(r.dedicated) ? r.location : r.dedicated; const p = findProject(name);
    return {type:'Dedicated', rule:'100% to one project', alloc: p?[{pid:p.id,share:100}]:[], issue: p?'':`Project "${name}" not found`};
  }
  if (!isNo(r.shared)){
    const raw = String(r.shared).trim();
    if (/^all\s*equal$/i.test(raw)) return {type:'Shared', rule:'All projects, equal split', alloc:S.config.projects.map(p=>({pid:p.id,share:100/S.config.projects.length})), issue:''};
    if (isYes(raw) || /^all$/i.test(raw)){
      const t = S.config.projects.map(p=>({pid:p.id, t: month ? calcProject(p.id,month,'approved').target : 0})); const tot=t.reduce((s,x)=>s+x.t,0);
      return {type:'Shared', rule: tot>0?'All projects, weighted by month target':'All projects, equal split (no targets yet)', alloc:t.map(x=>({pid:x.pid, share: tot>0 ? x.t/tot*100 : 100/t.length})).filter(x=>x.share>0), issue:''};
    }

  const good = mergedRows('weekly',per,'good'), appr = mergedRows('weekly',per,'appr');

  const li = (r,t) => `<li><b style="font-weight:500">${esc(r.name)}</b> — ${esc(t)} <span class="faint small">(${esc(r.by)})</span></li>`;
  return `<section class="panel" style="margin-top:18px"><div class="panel-head"><h2>People highlights · Week ${n}</h2></div><div class="grid2" style="grid-template-columns:1fr 1fr">

}

/* ---------- ui helpers ---------- */
const $ = s => document.querySelector(s);
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function ask(title, body, ok='Confirm', danger=false){
  return new Promise(res=>{ const d=$('#dlg'); d.innerHTML=`<h2>${esc(title)}</h2><p class="muted" style="margin:10px 0 20px">${esc(body)}</p><div class="row" style="justify-content:flex-end"><button class="btn" value="0">Cancel</button><button class="btn ${danger?'danger':'primary'}" value="1">${esc(ok)}</button></div>`;
    d.querySelectorAll('button').forEach(b=>b.onclick=()=>{ d.close(); res(b.value==='1'); }); d.oncancel=()=>res(false); d.showModal(); });
}
const logoHTML = () => `<div class="logo"><img src="${LOGO_SRC}" alt="Mangalam Landmarks"></div>`;
function monthsAvailable(){ const set = new Set(fyMonths(todayMonth())); Object.values(S.entries).forEach(e=>e.month&&set.add(e.month)); return [...set].sort(); }
function quartersAvailable(){ const set=new Set(); monthsAvailable().forEach(m=>set.add(quarterOf(m).id)); return [...set].sort(); }
async function saveConfig(msg){ try{ await Store.set('app','config',S.config); if(msg) toast(msg); }catch(e){ toast('Could not save: '+e.message); } }
async function saveEntry(e){ S.entries[entryId(e.month,e.projectId)] = e; await Store.set('entries', entryId(e.month,e.projectId), e); }
async function saveFile(filename, blob){
  let dl=null; try{ if (window.claude?.use) dl = await Promise.race([window.claude.use('downloads'), new Promise(r=>setTimeout(()=>r(null),3000))]); }catch(e){}
  if (dl){ try{ await dl.save({filename, data:blob}); return; }catch(e){ if (e && e.code==='declined') return; } }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
function wbBlob(wb){ const out = XLSX.write(wb,{bookType:'xlsx',type:'array'}); return new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}); }
const statusLabel = s => ({draft:'Draft',submitted:'Awaiting approval',approved:'Approved',returned:'Returned'}[s]||s);
const kpi = (l,v,s='') => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
const emptyHTML = (t='No figures yet', b='Figures appear here once weekly entries are submitted and approved.') => `<div class="empty"><h3>${t}</h3><p>${b}</p></div>`;

  S.view = homeView(role); S.deptPeriod = role==='hod' ? 'weekly' : 'monthly'; S.projectSel = role==='project'?id:(visibleProjects()[0]?.id); S.deptSel = role==='hod'?id:(S.config.departments[0]?.id);

  const c=S.config;
  $('#app').innerHTML = `<div class="login-wrap"><form class="login" id="loginForm">${logoHTML()}

  }
  const mode=viewMode(); const pf = calcPortfolio(pids, S.month, mode); const mi=pf.mi; const U=S.config.settings.unit;

  h += `<section class="panel" style="margin-top:18px"><div class="panel-head"><h2>Against the incentive line</h2><span class="muted small">Red dot is ${thr()}%; grey tick is where the project should be by now</span></div>${board(pf)}</section>`;

function quarterProjects(qd){
  const U=S.config.settings.unit;
  const head = qd.Q.months.map(m=>`<th class="num">${MN[+m.slice(5)-1]} target</th><th class="num">${MN[+m.slice(5)-1]} achieved</th>`).join('');
  const rows = qd.rows.map(r=>`<tr><td><b style="font-weight:500">${esc(r.p.name)}</b></td>${r.ms.map(x=>`<td class="num">${x.target?fmt(x.target):'<span class="faint">–</span>'}</td><td class="num">${x.reported?fmt(x.ach):'<span class="faint">–</span>'}</td>`).join('')}<td class="num"><b style="font-weight:500">${fmt(r.target)}</b></td><td class="num"><b style="font-weight:500">${fmt(r.ach)}</b></td><td class="num">${pctChip(r.pct)}</td></tr>`).join('');
  const tot = `<tr class="grand"><td>Total</td>${qd.Q.months.map(m=>{ const t=qd.rows.reduce((s,r)=>s+r.ms.find(x=>x.m===m).target,0), a=qd.rows.reduce((s,r)=>s+r.ms.find(x=>x.m===m).ach,0); return `<td class="num">${fmt(t)}</td><td class="num">${fmt(a)}</td>`; }).join('')}<td class="num">${fmt(qd.target)}</td><td class="num">${fmt(qd.ach)}</td><td class="num">${pctS(qd.pct)}</td></tr>`;
  const groups = qd.rows.map(r=>({label:r.p.name, values:[r.pct]}));
  return `<div class="kpis">${kpi('Quarter target ('+esc(U)+')',fmt(qd.target))}${kpi('Achieved',fmt(qd.ach))}${kpi('Achieved %',pctS(qd.pct))}${kpi('Projects past '+thr()+'%', qd.rows.filter(r=>r.pct>=thr()).length+' / '+qd.rows.length)}</div>
  <section class="panel"><div class="panel-head"><h2>Quarter planned vs achieved by project</h2><span class="muted small">Each month's target and month-end achievement, added up</span></div>
  <div class="tbl-wrap"><table><thead><tr><th>Project</th>${head}<th class="num">Quarter target</th><th class="num">Quarter achieved</th><th class="num">%</th></tr></thead><tbody>${rows}${tot}</tbody></table></div></section>
  <section class="panel"><div class="panel-head"><h2>Quarter achievement by project</h2></div>${qd.rows.some(r=>r.pct!=null)?barChart({groups,pctMode:true,ref:thr(),colors:[v=>v>=thr()?'var(--good)':'var(--steel)']}):emptyHTML('No approved months in this quarter yet','')}</section>`;
}
function summaryTable(pf){
  const U=S.config.settings.unit; const mi=pf.mi; let rows=''; let sr=0;
  pf.list.forEach(c=>{
    c.blds.forEach((b,i)=>{ sr++; rows += `<tr><td>${sr}</td><td>${i===0?`<b style="font-weight:500">${esc(c.p.name)}</b>`:''}</td><td>${esc(b.name)}</td><td class="num">${fmt(b.target)}</td>${b.weeks.map(w=>`<td class="num">${w.cum==null?'<span class="faint">–</span>':fmt(w.cum)}</td>`).join('')}<td class="num">${paceChip(b.pct,c.daysDone,mi.dim)}</td></tr>`; });
    rows += `<tr class="total"><td></td><td></td><td>Total ${esc(c.p.name)}</td><td class="num">${fmt(c.target)}</td>${c.weeks.map(w=>`<td class="num">${w.cum==null?'–':fmt(w.cum)}</td>`).join('')}<td class="num">${paceChip(c.pct,c.daysDone,mi.dim)}</td></tr>`;
  });
  rows += `<tr class="grand"><td></td><td></td><td>Grand total</td><td class="num">${fmt(pf.target)}</td>${pf.weeks.map(w=>`<td class="num">${w.cum==null?'–':fmt(w.cum)}</td>`).join('')}<td class="num">${pctS(pf.pct)}</td></tr>`;
  return `<div class="tbl-wrap"><table><thead><tr><th>Sr</th><th>Project</th><th>Building</th><th class="num">${mi.name} target</th>${mi.weeks.map(w=>`<th class="num">Week ${w.n}</th>`).join('')}<th class="num">% achieved</th></tr></thead><tbody>${rows}</tbody></table></div><p class="faint small" style="margin-top:8px">Week columns show achievement to date (cumulative) at each weekend. Figures in ${esc(U)}.</p>`;
}
function heatmap(pf){
  const rows = pf.list.map(c=>c.blds.filter(b=>b.target>0).map((b,i)=>`<tr><td>${i===0?`<b style="font-weight:500">${esc(c.p.name)}</b>`:''}</td><td>${esc(b.name)}</td>${b.weeks.map(w=>{ const p = w.cum!=null&&b.target>0 ? w.cum/b.target*100 : null; return `<td class="h">${p==null?'<span class="faint">–</span>':`<span class="pct ${paceTone(p,w.end,pf.mi.dim)}">${Math.round(p)}%</span>`}</td>`; }).join('')}</tr>`).join('')).join('');
  return rows ? `<p class="faint small" style="margin-bottom:8px">Each cell is coloured against the ${thr()}% pace for that weekend (for example ${pctS(paceExp(pf.mi.weeks[0].end,pf.mi.dim))} by the end of Week 1).</p><div class="tbl-wrap heat"><table><thead><tr><th>Project</th><th>Building</th>${pf.mi.weeks.map(w=>`<th>Week ${w.n}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>` : emptyHTML('No targets set','Month targets are entered on the weekly entry screen.');
}
function fyTrend(pids){
  const groups = fyMonths(S.month).map(m=>{ const pf = calcPortfolio(pids,m,'approved'); return {label:monthInfo(m).short, values:[pf.pct]}; });
  if (!groups.some(g=>g.values[0]!=null)) return emptyHTML('No approved months yet','Each month appears here once its weekly figures are approved.');
  return barChart({groups, pctMode:true, ref:thr(), colors:[v=>v>=thr()?'var(--good)':'var(--steel)']});
}

  return topbar(esc(c.p.name), `${monthInfo(S.month).label} · Cluster head: ${esc(cl?cl.name:'CEO (no cluster head assigned)')} · ${c.p.buildings.length} building${c.p.buildings.length===1?'':'s'}`, sel, 'month', true) + projectBody(c);

function projectBody(c){
  const U=S.config.settings.unit; const pf = {list:[c], pct:c.pct, lastIdx:c.lastIdx, need80:c.need80, remWeeks:c.remWeeks, mi:c.mi};

  let h = `<div class="kpis">${kpi('Month target ('+esc(U)+')',fmt(c.target))}${kpi('Achieved to date',fmt(c.mtd), c.last?'till Week '+c.last.n+' (day '+c.daysDone+' of '+c.mi.dim+')':'nothing approved yet')}${kpi('Achieved %',`<span style="color:var(--${pt==='none'?'ink':pt})">${pctS(c.pct)}</span>`, c.expNow!=null?`${thr()}% pace by now: ${pctS(c.expNow)}`:'')}${kpi('Still needed for '+thr()+'%', c.target<=0?'–':c.need80<=0?'Achieved':fmt(c.need80), c.need80>0&&!c.closed&&c.target>0?fmt(c.perWeek80)+' per 7-day week':'')}${kpi('Balance to 100%', c.target<=0?'–':fmt(c.need100), c.remDays+' day'+(c.remDays===1?'':'s')+' left')}</div>`;
  const chart = c.target>0 ? lineChart({series:[{name:c.p.name,color:'var(--steel)',points:[0,...c.weeks.map(w=>w.cumPct)], req:[null,...c.weeks.map((w,i)=> i===c.lastIdx ? w.cumPct : c.reqPct[i]).map((v,i,arr)=> c.lastIdx<0 && i===0 ? 0 : v)]}],labels:weekLabels(c.mi),ref:thr(),height:250}) : emptyHTML('No target set','');
  h += `<div class="pcards" style="grid-template-columns:1fr;margin-bottom:18px">${projectCard(c).replace(/<div><button[\s\S]*?<\/div><\/article>/,'</article>')}</div>`;
  h += `<div class="grid2"><section class="panel"><div class="panel-head"><h2>Cumulative achievement</h2><span class="legend" style="margin:0"><span><i style="width:16px;height:0;border-top:2px dashed var(--brand)"></i>Required path to ${thr()}%</span></span></div>${chart}</section>

function entryLocks(e, n){

  const anyApproved = Object.values(e.weeks||{}).some(w=>w.status==='approved');
  return {W, weekLocked, targetLocked: !ceo && anyApproved};
}
function prevCum(e, bid, n){ let raw=0, found=false; for (let k=1;k<n;k++){ const v=wk(e,k).vals?.[bid]; if (v){ raw = has(v.cum)?num(v.cum):raw+num(v.a); found=true; } } return found?raw:null; }
function entryProjects(){
  const vis = visibleProjects(); if (S.user.role==='project') return vis;
  if (S.user.role==='coord' || S.projectSel==='__all') return vis;

}

function updateEntryCalc(){
  document.querySelectorAll('section[data-proj]').forEach(sec=>{
    let T={mt:0,cum:0};
    sec.querySelectorAll('tr[data-row]').forEach(tr=>{
      const mtI=tr.querySelector('[data-in="mt"]'), cI=tr.querySelector('[data-in="cum"]');
      const mt=num(mtI.value); const cum = cI.value!=='' ? num(cI.value) : (cI.dataset.prev!==''?num(cI.dataset.prev):null);
      tr.querySelector('[data-o="pct"]').innerHTML = cum==null?'<span class="faint">–</span>':paceChip(mt>0?cum/mt*100:null,+sec.dataset.end,+sec.dataset.dim);
      T.mt+=mt; T.cum+=cum||0;
    });
    const set=(k,v)=>sec.querySelector(`[data-o="${k}"]`).innerHTML=v;
    set('tmt',fmt(T.mt)); set('tcum',fmt(T.cum)); set('tpct',paceChip(T.mt>0?T.cum/T.mt*100:null,+sec.dataset.end,+sec.dataset.dim));

async function persistEntry(action){
  const n=S.week; const now=new Date().toISOString(); const by=S.user.name; const docs=[]; const drops=[]; const noReason=[];
  for (const sec of document.querySelectorAll('section[data-proj]')){
    const p = proj(sec.dataset.proj); const e = JSON.parse(JSON.stringify(getEntry(S.month,p.id)));
    const {weekLocked, targetLocked} = entryLocks(e,n); if (weekLocked) continue;
    e.targets ||= {}; e.weeks ||= {}; const W = e.weeks[n] || {vals:{},status:'draft',log:[]}; W.vals ||= {}; W.log ||= [];
    let touched = Object.keys(W.vals).length>0;
    sec.querySelectorAll('tr[data-row]').forEach(tr=>{
      const b=tr.dataset.row; const mt=tr.querySelector('[data-in="mt"]').value.trim(); const cI=tr.querySelector('[data-in="cum"]'); const cv=cI.value.trim(); const rv=tr.querySelector('[data-in="r"]').value.trim();
      if (!targetLocked){ if (mt==='') delete e.targets[b]; else { e.targets[b]=num(mt); touched=true; } }
      const prev = cI.dataset.prev!=='' ? num(cI.dataset.prev) : null;
      const bn = proj(p.id).buildings.find(x=>x.id===b)?.name;
      if (cv!==''){ W.vals[b]={cum:num(cv)}; touched=true; if (prev!=null && num(cv)<prev) drops.push(`${p.name} ${bn}`); }
      else if (prev!=null) W.vals[b]={cum:prev};
      else delete W.vals[b];
      if (W.vals[b]){ if (rv){ W.vals[b].r=rv; touched=true; } const tgt=num(e.targets[b]); const mi2=monthInfo(S.month); if (!rv && tgt>0 && W.vals[b].cum/tgt*100 < paceExp(mi2.weeks[n-1].end,mi2.dim)*0.85) noReason.push(`${p.name} ${bn}`); }
    });
    if (!touched) continue;
    docs.push({p,e,W});
  }
  if (!docs.length) return toast('Nothing entered yet');
  if (action!=='draft' && noReason.length && !(await ask('Reason for delay missing', `These buildings are well behind the ${thr()}% pace and have no remark: ${noReason.join(', ')}. The CEO dashboard shows remarks next to delays; please add a short reason.`, 'Submit without reason'))) return;
  if (drops.length && !(await ask('Achievement went down', `Achieved to date is lower than last week for: ${drops.join(', ')}. Achievement is cumulative, so it normally only goes up.`, 'Save anyway'))) return;
  try{
    for (const {p,e,W} of docs){
      if (action==='draft'){ W.status = W.status==='returned'?'returned':'draft'; W.log.push({at:now,by,action:'saved draft'}); }
      else if (S.user.role==='ceo'){ W.status='approved'; W.approvedBy='CEO'; W.approvedAt=now; W.log.push({at:now,by,action:'entered and approved'}); }
      else { W.status='submitted'; W.submittedAt=now; W.submittedBy=by; W.log.push({at:now,by,action:'submitted'}); }
      W.log=W.log.slice(-20); e.weeks[n]=W; e.month=S.month; e.projectId=p.id; e.updatedAt=now;
      await saveEntry(e);
    }
    S.dirty=false; toast(action==='draft'?'Draft saved':S.user.role==='ceo'?'Saved and approved':`Submitted for approval (${docs.length} project${docs.length>1?'s':''})`); render();
  }catch(err){ toast('Could not save: '+err.message); }
}

function vPolicy(){

  <h2 style="margin-top:0">1. Principle</h2><p>Incentive rewards the people who make a project deliver its monthly target. It is earned project by project: a project that crosses the line pays its team, a project that does not pays nothing, and one project's surplus never covers another project's shortfall.</p>
  <h2>2. When a project qualifies</h2><div class="formula">Project achievement % = approved achievement for the month ÷ month target × 100
Qualifies when achievement % ≥ ${T}%</div>
  <ul><li>Only figures approved by the cluster head count. Drafts and pending weeks are ignored.</li><li>The month is final when the last week (Week ${monthInfo(S.month).N} of ${monthInfo(S.month).label}) is approved for every project.</li><li>Targets are locked once any week of the month is approved, so the bar cannot move after the fact.</li></ul>
  <h2>3. Rate</h2><div class="formula">${slabs.map(s=>`Achievement ≥ ${s.min}%  →  ${s.pct}% of ${base}`).join('\n')}
Below ${slabs[0].min}%  →  nil</div>
  <h2>4. Formula for every person</h2><div class="formula">Incentive = Σ over each project the person is allocated to:
            ${base} × allocation share % × project rate %</div>
  <h3>Dedicated project staff</h3><p>100% of their time is on one project, so they earn fully on that project.</p>
  <div class="formula">Example: Site engineer on Marvel, ${base} ₹60,000. Marvel reaches ${T}%.
₹60,000 × 100% × ${rate}% = ₹${nf0.format(ex(60000,100,rate))}</div>
  <h3>Shared resources</h3><p>People who support several projects (QS, MEP, planning, safety). Their base is split across the projects they support, and they earn only on the share belonging to projects that qualify.</p>
  <div class="formula">Example: QS engineer, ${base} ₹90,000, Shared "Marvel:60, Miraya:40".
Marvel qualifies, Miraya does not.
₹90,000 × 60% × ${rate}% + ₹90,000 × 40% × 0% = ₹${nf0.format(ex(90000,60,rate))}</div>
  <h3>Heads of shared functions (HOD Contracts, Planning, Purchase and similar)</h3><p>They influence every project, but larger projects carry more of the business. Mark them <b>All</b> in the Shared column: their base is spread across all projects in proportion to each project's month target. Use <b>All equal</b> only when an equal split is intended.</p>
  <div class="formula">Example: HOD Contracts, ${base} ₹2,00,000, Shared "All".
Targets: Marvel 400, Miraya 400, Midas City 200 (total 1,000) → shares 40%, 40%, 20%.
Marvel and Midas City qualify: ₹2,00,000 × (40% + 20%) × ${rate}% = ₹${nf0.format(ex(200000,60,rate))}</div>
  <h2>5. What the staff master must say</h2><ul><li><b>Dedicated:</b> the project name (or Yes, with the project in Location).</li><li><b>Shared:</b> project names (equal split), names with shares (Marvel:60, Miraya:40), All (target-weighted) or All equal.</li><li>Fill only one of the two. Base pay is taken from ${st.base==='ctc'?'Monthly CTC':'Monthly Gross'} (change in Settings).</li></ul>
  <h2>6. Adjustments and governance</h2><ul>
   <li><b>Finalise</b> the month in Finalise & adjust once it is closed. Amounts are then locked.</li>
   <li><b>Pro-rate</b> for mid-month joiners and leavers by days on the rolls; enter the adjusted amount with the reason.</li>
   <li><b>Withhold</b> for people serving notice, on long unpaid leave, or under a disciplinary process; record the reason.</li>
   <li><b>Recover</b> in the following month if approved figures are later found wrong; record the recovery as a reduction with the reason.</li>

  </section>`;
}

  const type = S.notesType; const period = notesPeriod(); const saved = S.meetings[noteId(type,period,S.user)]; const d = saved || {bott: carriedBottlenecks(type,period)};
  const mi = monthInfo(S.month); if (S.week>mi.N) S.week=mi.N;

  const sub = `${periodLabel(type,period)}. Shown in the ${where} meeting under your name.`;

    const cell = (k,i,f,l,t,v) => t==='status' ? `<select class="in" data-nf="1" data-sheet="${k}" data-r="${i}" data-f="${f}" aria-label="Row ${i+1} ${l}">${STATUS.map(x=>`<option ${x===(v||'Open')?'selected':''}>${x}</option>`).join('')}</select>`
      : `<input class="in" ${t==='date'?'type="date"':''} data-nf="1" data-sheet="${k}" data-r="${i}" data-f="${f}" value="${esc(v||'')}" aria-label="${esc(sh.title)} row ${i+1} ${esc(l)}">`;
    const body = Array.from({length:Math.max(ROWS,rows.length)},(_,i)=>`<tr><td class="idx">${i+1}</td>${sh.cols.map(([f,l,t])=>`<td ${t==='status'?'style="width:130px"':t==='date'?'style="width:150px"':''}>${cell(k,i,f,l,t,rows[i]?.[f])}${f==='area'&&rows[i]?.from?`<div class="faint small">from ${esc(rows[i].from)}</div><input type="hidden" data-sheet="${k}" data-r="${i}" data-f="from" value="${esc(rows[i].from)}">`:''}</td>`).join('')}</tr>`).join('');
    h += `<section class="panel" style="margin-top:16px"><div class="panel-head"><h2>${sh.title}</h2><span class="muted small">${sh.hint}</span></div><div class="tbl-wrap sheet"><table><thead><tr><th>#</th>${sh.cols.map(([,l])=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div></section>`;
  });
  h += `<div class="row" style="margin-top:16px">${saved?.updatedAt?`<span class="faint small">Last saved ${new Date(saved.updatedAt).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}</span>`:''}<span class="spacer"></span><button class="btn primary" data-act="saveNotes">Save notes</button></div>`;

}
async function saveNotes(){
  const type=S.notesType, period=notesPeriod(); const doc={type, period, author:{role:S.user.role,id:S.user.id,name:S.user.name}, updatedAt:new Date().toISOString()};
  Object.keys(SHEETS).forEach(k=>{ const rows={}; document.querySelectorAll(`[data-sheet="${k}"]`).forEach(i=>{ (rows[i.dataset.r] ||= {})[i.dataset.f]=i.value.trim(); });
    const list = Object.keys(rows).sort((a,b)=>a-b).map(r=>rows[r]).filter(r=>Object.entries(r).some(([f,v])=>v && !['status','from','due'].includes(f))); if (list.length) doc[k]=list; });
  const id = noteId(type,period,S.user); S.meetings[id]=doc;
  try{ await Store.set('meetings', id, doc); S.dirty=false; toast('Notes saved'); render(); }catch(e){ toast('Could not save: '+e.message); }

function notesSlide(type, period, key, empty, filter){
  const sh=SHEETS[key]; const rows = mergedRows(type,period,key).filter(filter||(()=>true));
  const pad = Array.from({length:Math.max(0,ROWS-rows.length)},()=>null);
  const show = (r,f,t) => !r ? '' : t==='status' ? stChip(r[f]) : t==='date' ? (r[f]?new Date(r[f]).toLocaleDateString('en-IN',{day:'numeric',month:'short'}):'') : esc(r[f]||'') + (f==='area'&&r.from?`<div class="faint small">since ${esc(r.from)}</div>`:'');
  const body = rows.concat(pad).map((r,i)=>`<tr style="height:40px"><td class="faint">${i+1}</td>${sh.cols.map(([f,,t])=>`<td>${show(r,f,t)}</td>`).join('')}<td class="muted small">${r?esc(r.by):''}</td></tr>`).join('');

async function saveDeptDoc(fy, did, fn){

async function saveTargets(){
  const did=S.deptSel, per=S.deptPeriod, v=collectKpiInputs();
  const fy = per==='quarterly' ? qInfo(S.quarter).fy : fyStart(S.month);
  const key = per==='weekly' ? `${S.month}-W${S.week}` : per==='monthly' ? S.month : S.quarter;
  const bucket = per==='weekly'?'weeks':per==='monthly'?'months':'quarters';
  const missing = Object.entries(v).filter(([id,x])=>{ const cur = deptPeriod(did,per).kpis.find(k=>k.id===id); const t = has(x.t)?num(x.t):cur?.fromT, a = has(x.a)?num(x.a):cur?.fromA; return (x.name||cur) && t>0 && a!=null && a/t*100<thr() && !x.r && !(cur&&cur.r); }).map(([id,x])=>x.name||id);
  if (missing.length && !(await ask('Reason for delay missing', `Below ${thr()}% with no remark: ${missing.join(', ')}. The CEO sees these reasons next to each delay.`, 'Save without reason'))) return;
  saveDeptDoc(fy, did, doc=>{
    const store = (doc[bucket] ||= {})[key] ||= {};
    doc.kpis.forEach(k=>{ const x=v[k.id]; if(!x) return; if (x.name) k.name=x.name; if (x.unit!=null) k.unit=x.unit; if (x.agg) k.agg=x.agg; store[k.id]={t:x.t??'', a:x.a??'', r:x.r??''}; });

function deptTableHTML(r, per){

  return `<div class="tbl-wrap"><table><thead><tr><th>KPI / goal</th><th class="num">${per==='quarterly'?'Planned':'Target'}</th><th class="num">Achieved</th><th class="num">%</th><th>Remarks / reason for delay</th></tr></thead><tbody>${r.kpis.map(k=>`<tr><td>${esc(k.name)}<div class="faint small">${esc(k.unit||'')}</div></td><td class="num">${fmt(k.t)}</td><td class="num">${fmt(k.a)}</td><td class="num">${pctChip(k.pct)}</td><td class="small">${esc(k.r||'')}</td></tr>`).join('')}</tbody></table></div>`;
}

function meetingProjects(){ const u=S.user; if (u.role==='cluster') return S.config.projects.filter(p=>p.clusterId===u.id); if (u.role==='project') return S.config.projects.filter(p=>p.id===u.id); return S.config.projects; }
const meetMode = () => ['ceo','cluster'].includes(S.user.role) ? viewMode() : 'approved';
const showDepts = () => S.user.role!=='cluster' && S.user.role!=='project';
const scopeNote = () => S.user.role==='cluster' ? `Your projects: ${meetingProjects().map(p=>esc(p.name)).join(', ')}` : '';
const notePage = (type, per, key, title, sub, empty) => ({t:title, html:()=>{ const f = key==='bott' ? bottFilter() : null; return `<h1>${title}</h1><p class="muted" style="margin:4px 0 18px">${sub}${f?` · raised by or needing ${esc(dept(S.user.id)?.name)}`:''}</p>${notesSlide(type,per,key,empty,f)}`; }});
function bottFilter(){ if (S.user.role!=='hod') return null; const d=dept(S.user.id); const k=slug(d.name); return r => slug(r.by)===k || slug(r.support||'').includes(k); }
function hodSlides(type){

function openMeeting(type){ S.meet = {type, i:0, week: todayWeek(S.month)}; renderMeet(); try{ document.documentElement.requestFullscreen?.().catch(()=>{}); }catch(e){} }
function closeMeeting(){ S.meet=null; $('#meet')?.remove(); try{ if (document.fullscreenElement) document.exitFullscreen(); }catch(e){} render(); }
function renderMeet(){
  const type=S.meet.type; const slides = type==='weekly' ? weeklySlides() : type==='monthly' ? monthlySlides() : quarterlySlides();
  S.meet.i = Math.max(0,Math.min(S.meet.i,slides.length-1)); const s=slides[S.meet.i]; const mi=monthInfo(S.month);
  let el = $('#meet'); if(!el){ el=document.createElement('div'); el.id='meet'; el.className='meet'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Meeting'); document.body.appendChild(el); }
  const monthSel = `<select class="in" data-mchg="month" aria-label="Month">${monthsAvailable().map(m=>`<option value="${m}" ${m===S.month?'selected':''}>${monthInfo(m).short}</option>`).join('')}</select>`;
  const periodSel = type==='weekly' ? monthSel+`<select class="in" data-mchg="week" aria-label="Week">${mi.weeks.map(w=>`<option value="${w.n}" ${w.n===S.meet.week?'selected':''}>Week ${w.n}</option>`).join('')}</select>`
    : type==='monthly' ? monthSel : `<select class="in" data-mchg="quarter" aria-label="Quarter">${quartersAvailable().map(q=>`<option value="${q}" ${q===S.quarter?'selected':''}>${qInfo(q).label}</option>`).join('')}</select>`;
  const title = type==='weekly' ? `Weekly review · ${mi.label} · Week ${S.meet.week}` : type==='monthly' ? `Monthly review · ${mi.label}` : `Quarterly review · ${qInfo(S.quarter).label}`;
  el.innerHTML = `<div class="meet-top">${logoHTML()}<div style="margin-left:12px"><div style="font-weight:500;font-size:16px">${title}</div><div class="small muted">${S.meet.i+1} of ${slides.length}: ${esc(s.t)}</div></div><span class="spacer"></span>
    <div class="dots">${slides.map((_,i)=>`<i class="${i===S.meet.i?'on':''}"></i>`).join('')}</div>${periodSel}
    <select class="in" data-mchg="jump" aria-label="Go to">${slides.map((x,i)=>`<option value="${i}" ${i===S.meet.i?'selected':''}>${esc(x.t)}</option>`).join('')}</select>
    <button class="btn" data-mact="prev" ${S.meet.i===0?'disabled':''}>Previous</button><button class="btn primary" data-mact="next" ${S.meet.i===slides.length-1?'disabled':''}>Next</button><button class="btn ghost" data-mact="exit">Close</button></div>
    <div class="meet-body"><div class="inner">${s.html()}</div></div>`;
  el.querySelector('.meet-body').scrollTop=0;
  el.onclick = ev=>{ const b=ev.target.closest('[data-mact]'); if(!b) return; const a=b.dataset.mact; if(a==='prev'){S.meet.i--;renderMeet();} if(a==='next'){S.meet.i++;renderMeet();} if(a==='exit') closeMeeting(); };
  el.onchange = ev=>{ const k=ev.target.dataset.mchg; if(k==='jump') S.meet.i=+ev.target.value; if(k==='week') S.meet.week=+ev.target.value; if(k==='quarter') S.quarter=ev.target.value; if(k==='month'){ S.month=ev.target.value; S.meet.week=Math.min(S.meet.week,monthInfo(S.month).N); } renderMeet(); };
}
document.addEventListener('keydown', ev=>{ if(!S.meet || ev.target.matches('input,select,textarea')) return;
  if (ev.key==='ArrowRight'||ev.key==='PageDown'){ S.meet.i++; renderMeet(); } else if (ev.key==='ArrowLeft'||ev.key==='PageUp'){ S.meet.i--; renderMeet(); } else if (ev.key==='Escape'){ closeMeeting(); } });

  let sr=0; pf.list.forEach(c=>{ c.blds.forEach((b,i)=>{ sr++; aoa.push([sr, i===0?c.p.name:'', b.name, b.target, ...b.weeks.map(w=>w.cum??''), b.pct==null?'':+(b.pct/100).toFixed(4), i===0&&c.pct!=null?+(c.pct/100).toFixed(4):'']); });
    aoa.push(['','', 'TOTAL', c.target, ...c.weeks.map(w=>w.cum??''), c.pct==null?'':+(c.pct/100).toFixed(4),'']); });

  const range = XLSX.utils.decode_range(ws['!ref']); const pc=[4+mi.N, 5+mi.N]; for(let R=3;R<=range.e.r;R++) for (const C of pc){ const a=XLSX.utils.encode_cell({r:R,c:C}); if(ws[a]&&typeof ws[a].v==='number') ws[a].z='0.0%'; }
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Summary');

function exportIncentive(){
  const run = incentiveRun(S.month); const mi=monthInfo(S.month); const fin=run.fin; const fmap={}; (fin?.rows||[]).forEach(x=>fmap[x.id]=x);
  const status = fin ? `Finalised ${new Date(fin.at).toLocaleDateString('en-IN')} by ${fin.by}` : monthClosed(S.month) ? 'Calculated, month closed, not finalised' : 'Draft: month not closed';
  const wb=XLSX.utils.book_new(); const add=(name,aoa,cols)=>{ const ws=XLSX.utils.aoa_to_sheet(aoa); if(cols) ws['!cols']=cols.map(w=>({wch:w})); XLSX.utils.book_append_sheet(wb,ws,name); };
  const sum=[[`Project incentive · ${mi.label}`],[status],[`Rule: ${ruleText()}`],[],['Project','Month target','Achieved','Achieved %','Qualifies','Rate %','Dedicated people','Shared FTE','Dedicated payout','Shared payout','Total payout']];
  run.pf.list.forEach(c=>{ const b=run.byProject[c.pid]; const q=run.pmap[c.pid]; sum.push([c.p.name,c.target,c.mtd,c.pct==null?'':+c.pct.toFixed(1),q.earnPct?'Yes':'No',q.earnPct,b.dedHeads,+b.shFte.toFixed(2),Math.round(b.ded),Math.round(b.sh),Math.round(b.earned)]); });
  sum.push([],['Total','','','','','','','',Math.round(Object.values(run.byProject).reduce((s,b)=>s+b.ded,0)),Math.round(Object.values(run.byProject).reduce((s,b)=>s+b.sh,0)),Math.round(run.calcTotal)]);
  if (fin) sum.push(['Adjustments after finalisation','','','','','','','','','',Math.round(run.total-fin.rows.reduce((s,x)=>s+num(x.calc),0))],['Final payable','','','','','','','','','',Math.round(run.total)]);
  add('Summary', sum, [18,13,12,11,10,8,15,11,15,13,13]);
  const head=['Name','Designation','Department','Location','Type','Allocation rule','Projects and shares','Monthly base','Calculated','Final payable','Adjustment','Reason'];
  const line = r => { const f=fmap[r.id]; const calc=f?num(f.calc):Math.round(r.earned); const final=f?num(f.final):Math.round(r.earned); return [r.name,r.designation,r.department,r.location,r.type,r.rule,allocText(r),r.base,calc,final,final-calc,f?.reason||'']; };
  const cols=[24,18,16,14,11,30,34,12,12,13,11,30];
  add('All employees',[head,...run.rows.map(line)],cols);
  add('Dedicated',[head,...run.rows.filter(r=>r.type==='Dedicated').map(line)],cols);
  add('Shared',[head,...run.rows.filter(r=>r.type!=='Dedicated').map(line)],cols);
  const split=[['Project','Name','Designation','Type','Share %','Monthly base','Base on this project','Project achieved %','Rate %','Incentive']];
  S.config.projects.forEach(p=>run.rows.forEach(r=>r.lines.filter(l=>l.pid===p.id).forEach(l=>split.push([p.name,r.name,r.designation,r.type,+l.share.toFixed(1),r.base,Math.round(r.base*l.share/100),l.pct==null?'':+l.pct.toFixed(1),l.rate,Math.round(l.e)]))));
  add('Project-wise split',split,[16,24,18,11,9,12,16,15,8,11]);
  add('Logic',[['How this workbook is calculated'],[],['1','A project qualifies when approved achievement for the month ÷ month target ≥ '+thr()+'%.'],['2','Rate: '+ruleText()+'. Below the first slab nothing is paid.'],['3','Incentive per person = Σ (monthly base × allocation share % × project rate %).'],['4','Dedicated: 100% share on one project.'],['5','Shared: listed projects, equal split unless shares are given (Marvel:60, Miraya:40).'],['6','All: every project weighted by its month target (heads of shared functions). All equal: equal split.'],['7','Final payable = calculated amount unless changed in Finalise & adjust; every change carries a reason.']],[4,110]);
  saveFile(`Project_Incentive_${MN[mi.m-1]}_${mi.y}${fin?'_Final':''}.xlsx`, wbBlob(wb));
}

function rng(seed){ let s=seed%2147483647; if(s<=0)s+=2147483646; return ()=> (s=s*16807%2147483647)/2147483647; }
async function loadDemo(){
  const ok = await ask('Load sample figures?','This writes made-up project figures from April to this month, department targets, meeting notes and a sample staff list. Real entries for those periods will be overwritten.','Load sample'); if(!ok) return;
  const r = rng(20260925); const perf = {'marvel':.97,'miraya':.74,'midas-city':.86,'mithila-01':.55,'shyni-gold':.78,'niyoshi-park':.9};
  const cur=todayMonth(); const months = fyMonths(cur).filter(m=>m<=cur); const cw=todayWeek(cur); const now=new Date().toISOString();
  toast('Writing sample figures…');
  for (const m of months){ const mi=monthInfo(m);
    for (const p of S.config.projects){ const e={month:m,projectId:p.id,targets:{},weeks:{}}; const base=(perf[p.id]??.8)+(r()-.5)*.22; const raw={};
      p.buildings.forEach(b=>{ e.targets[b.id]=Math.round(b.kind==='Infra'?15+r()*25:40+r()*80); raw[b.id]=0; });
      const lastW = m<cur ? mi.N : cw;
      for (let n=1;n<=lastW;n++){ const w=mi.weeks[n-1]; const vals={};
        let shape=1; if (m===cur && p.id==='miraya') shape=[1.1,.8,.5,.45,.4][n-1]; if (m===cur && p.id==='mithila-01') shape=[.6,.5,.7,.6,.6][n-1];
        p.buildings.forEach(b=>{ let add = e.targets[b.id]*w.days/mi.dim*base*shape*(0.75+r()*0.5); if (p.id==='marvel'&&b.name==='Wing D'&&m===cur) add=0; if (b.kind==='Infra'&&p.id==='midas-city') add*=.45; raw[b.id]=Math.round((raw[b.id]+add)*100)/100; vals[b.id]={cum:raw[b.id]};
          if (m===cur){ if (p.id==='marvel'&&b.name==='Wing D') vals[b.id].r='Revised structural drawings awaited'; if (p.id==='midas-city'&&b.kind==='Infra') vals[b.id].r='RMC supply delayed'; if (p.id==='miraya'&&n>=2&&b.name==='Wing B') vals[b.id].r='Shuttering contractor short of labour'; if (p.id==='mithila-01') vals[b.id].r='Slab cycle slow, extra gang from next week'; } });

        e.weeks[n]={vals,status,submittedAt:now,submittedBy:p.id==='midas-city'?S.config.coordinator.name:p.name,...(status==='approved'?{approvedBy:cluster(p.clusterId)?.name||'CEO',approvedAt:now}:{}),log:[]};
      }
