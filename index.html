<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mangalam · Weekly Achievement & Incentive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#ECEEF0; --surface:#FFFFFF; --surface-2:#F6F7F8; --ink:#22262A; --ink-2:#59626B; --ink-3:#8A939B;
  --line:#D6DBE0; --line-2:#E7EAED;
  --brand:#D7262F; --steel:#35546E; --steel-2:#9DB2C4;
  --good:#067647; --good-bg:#E4F4EB; --watch:#8F5B00; --watch-bg:#FBF1D9; --risk:#B42318; --risk-bg:#FCE8E6;
  --info-bg:#E8EEF4;
  --r-lg:14px; --r-md:10px; --r-sm:6px;
  --font:"Archivo", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15181B; --surface:#1E2226; --surface-2:#252A2F; --ink:#E9ECEF; --ink-2:#A9B2BA; --ink-3:#7B858E;
    --line:#343A40; --line-2:#2B3035; --steel:#8FB0CC; --steel-2:#4F6A80;
    --good:#4ADE9A; --good-bg:#16352A; --watch:#E5B454; --watch-bg:#3A2F16; --risk:#FF8A80; --risk-bg:#3E1F1D; --info-bg:#22303C;
  }
}
:root[data-theme="dark"]{
  --bg:#15181B; --surface:#1E2226; --surface-2:#252A2F; --ink:#E9ECEF; --ink-2:#A9B2BA; --ink-3:#7B858E;
  --line:#343A40; --line-2:#2B3035; --steel:#8FB0CC; --steel-2:#4F6A80;
  --good:#4ADE9A; --good-bg:#16352A; --watch:#E5B454; --watch-bg:#3A2F16; --risk:#FF8A80; --risk-bg:#3E1F1D; --info-bg:#22303C;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
h1,h2,h3{font-stretch:78%;font-weight:750;letter-spacing:-.01em;margin:0;line-height:1.15}
h1{font-size:30px} h2{font-size:21px} h3{font-size:16px;font-stretch:90%}
p{margin:0}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:13px}
.num{text-align:right;white-space:nowrap}
/* logo */
.logo{display:inline-flex;flex-direction:column;line-height:1;user-select:none}
.logo b{font-size:23px;font-weight:800;font-stretch:88%;letter-spacing:-.02em;color:var(--ink);position:relative}
.logo b i{display:inline-block;width:7px;height:7px;background:var(--brand);border-radius:50%;margin-left:2px;vertical-align:baseline}
.logo span{font-size:10px;letter-spacing:.32em;color:var(--ink-2);margin-top:4px;font-weight:600}
.logo img{max-height:40px;max-width:180px}
/* login */
.login-wrap{min-height:100%;display:grid;place-items:center;padding:24px}
.login{width:min(430px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:32px}
.login h1{margin:28px 0 6px}
.login .field{margin-top:16px}
/* shell */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;height:100dvh}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:var(--r-sm);color:var(--ink-2);font-weight:560;display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--ink);color:var(--surface)}
.nav button:focus-visible{outline:2px solid var(--steel)}
.badge{font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--brand);color:#fff;display:inline-grid;place-items:center}
.who{margin-top:auto;border-top:1px solid var(--line-2);padding-top:14px;font-size:13px}
.who strong{display:block;font-size:14px}
.main{min-width:0;padding:26px 32px 60px}
.topbar{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.topbar .ctx{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.store-tag{font-size:12px;color:var(--ink-3)}
/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.danger{color:var(--risk);border-color:color-mix(in srgb,var(--risk) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input.in,select.in,textarea.in{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 10px;min-width:0}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--steel);outline-offset:0;border-color:transparent}
input.cell{width:100%;min-width:90px;text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:6px 8px}
input.cell:disabled{background:var(--surface-2);color:var(--ink-2);border-color:var(--line-2)}
label.lbl{display:block;font-size:13px;color:var(--ink-2);margin-bottom:5px;font-weight:560}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--surface)}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px}
.panel + .panel,.stack > * + *{margin-top:18px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
.grid2 > .panel + .panel{margin-top:0}
.grid2 > *{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;margin-bottom:18px}
.kpi{padding:14px 18px;border-right:1px solid var(--line-2)}
.kpi:last-child{border-right:0}
.kpi .v{font-size:25px;font-weight:760;font-stretch:80%;letter-spacing:-.01em}
.kpi .l{font-size:12.5px;color:var(--ink-2)}
.kpi .s{font-size:12px;color:var(--ink-3)}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:var(--r-md)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:640;color:var(--ink-2);text-align:left;font-size:12.5px;background:var(--surface-2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.total td{font-weight:700;background:var(--surface-2)}
tr.grand td{font-weight:800;background:var(--ink);color:var(--surface)}
tr.proj-row td:first-child{font-weight:700}
.pct{font-weight:700;padding:2px 8px;border-radius:5px;display:inline-block;min-width:58px;text-align:right}
.pct.good{color:var(--good);background:var(--good-bg)} .pct.watch{color:var(--watch);background:var(--watch-bg)} .pct.risk{color:var(--risk);background:var(--risk-bg)} .pct.none{color:var(--ink-3)}
.chip{font-size:12px;font-weight:650;padding:2px 9px;border-radius:20px;display:inline-block;white-space:nowrap}
.chip.draft{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.chip.submitted{background:var(--info-bg);color:var(--steel)}
.chip.approved{background:var(--good-bg);color:var(--good)}
.chip.returned{background:var(--risk-bg);color:var(--risk)}
.chip.empty{color:var(--ink-3)}
/* incentive line board (signature) */
.board{display:flex;flex-direction:column;gap:6px}
.lane{display:grid;grid-template-columns:150px 1fr 150px;gap:16px;align-items:center;padding:8px 0}
.lane + .lane{border-top:1px dashed var(--line-2)}
.lane .name{font-weight:700;font-stretch:88%;font-size:16px}
.lane .name small{display:block;font-weight:500;font-size:12px;color:var(--ink-3);font-stretch:100%}
.track{position:relative;height:30px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--surface-2) 0 calc(100%/12 - 1px),var(--line-2) calc(100%/12 - 1px) calc(100%/12))}
.track .fill{position:absolute;left:0;top:5px;bottom:5px;border-radius:3px;background:var(--steel);max-width:100%}
.track .fill.good{background:var(--good)}
.track .proj{position:absolute;top:1px;bottom:1px;width:0;border-left:2px dashed var(--ink-2)}
.track .proj::after{content:"";position:absolute;top:-4px;left:-5px;border:4px solid transparent;border-top-color:var(--ink-2)}
.track .line{position:absolute;top:-8px;bottom:-8px;width:2px;background:var(--brand);z-index:2}
.track .line::before{content:"";position:absolute;top:-6px;left:-5px;width:12px;height:12px;border-radius:50%;background:var(--brand)}
.lane .fig{text-align:right}
.lane .fig b{font-size:22px;font-stretch:80%;font-weight:780}
.lane .fig span{display:block;font-size:12px;color:var(--ink-2)}
.axis{display:grid;grid-template-columns:150px 1fr 150px;gap:16px;font-size:11px;color:var(--ink-3)}
.axis .ticks{position:relative;height:14px}
.axis .ticks span{position:absolute;transform:translateX(-50%)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:12px}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
.hero-num{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hero-num .big{font-size:64px;font-weight:800;font-stretch:70%;line-height:1;letter-spacing:-.02em}
/* insights */
.ins{display:grid;grid-template-columns:4px 1fr;gap:14px;padding:12px 0}
.ins + .ins{border-top:1px solid var(--line-2)}
.ins .bar{border-radius:2px;background:var(--steel)}
.ins.good .bar{background:var(--good)} .ins.watch .bar{background:var(--watch)} .ins.risk .bar{background:var(--risk)}
.ins h3{margin-bottom:3px}
.ins p{color:var(--ink-2);font-size:14px}
.ins .act{margin-top:5px;font-size:13.5px;color:var(--ink)}
.ins .act b{font-weight:700}
/* charts */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:520px}
.chart text{fill:var(--ink-2);font-family:var(--font);font-size:11px}
.heat td.h{text-align:center;font-weight:650;font-size:13px}
/* week tabs */
.weeks{display:flex;gap:8px;flex-wrap:wrap}
.weeks button{all:unset;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:8px 14px;min-width:120px}
.weeks button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.weeks button b{display:block;font-stretch:85%;font-size:15px}
.weeks button span{font-size:12px;color:var(--ink-2)}
.banner{border-radius:var(--r-md);padding:12px 16px;margin-bottom:14px;font-size:14px;background:var(--info-bg)}
.banner.risk{background:var(--risk-bg)} .banner.good{background:var(--good-bg)} .banner.watch{background:var(--watch-bg)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2)}
.empty h3{color:var(--ink);margin-bottom:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.cards > .panel + .panel{margin-top:0}
.bld-list{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.bld{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:center}
.kind{font-size:12px;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:var(--r-md);font-weight:600;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.18)}
dialog{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);color:var(--ink);padding:22px;width:min(520px,94vw)}
dialog::backdrop{background:rgba(20,24,28,.45)}
/* meeting */
.meet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.meet-top{display:flex;align-items:center;gap:16px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surface)}
.meet-body{flex:1;overflow:auto;padding:28px 40px}
.meet-body .inner{max-width:1320px;margin:0 auto}
.meet .dots{display:flex;gap:6px}
.meet .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.meet .dots i.on{background:var(--brand)}
.meet h1{font-size:40px}
.meet .kpi .v{font-size:32px}
@media (max-width:1020px){.grid2{grid-template-columns:1fr}.grid2 > .panel + .panel{margin-top:18px}}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:12px;border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;flex-wrap:wrap;gap:4px;order:3;width:100%}
  .nav button{padding:6px 10px;font-size:14px}
  .who{margin:0 0 0 auto;border:0;padding:0;text-align:right}
  .main{padding:18px 14px 50px}
  .lane,.axis{grid-template-columns:96px 1fr 88px;gap:10px}
  .lane .fig b{font-size:18px}
  .hero-num .big{font-size:48px}
  .meet-body{padding:18px}
}
@media (prefers-reduced-motion:no-preference){.track .fill{transition:width .5s ease}}
@media print{.side,.topbar .ctx{display:none}.shell{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script>
/* ================= Mangalam Weekly Achievement & Incentive ================= */
const LOGO_SRC = ""; // paste a data:image/png;base64,... of the official logo here to replace the wordmark
const slug = s => String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || ('x'+Date.now());
const B = (pid, name, kind='Building') => ({id: pid+'--'+slug(name), name, kind});
const DEFAULT_CONFIG = {
  settings:{unit:'₹ Lakhs', threshold:80, slabs:[{min:80,pct:30}], base:'gross'},
  ceo:{name:'CEO', password:'123'},
  clusters:[
    {id:'vijay', name:'Vijaykumar Bhalekar', password:'123'},
    {id:'dinesh', name:'Dinesh Chavan', password:'123'},
    {id:'upendra', name:'Upendra Gulve', password:'123'}
  ],
  projects:[
    {id:'marvel', name:'Marvel', clusterId:'vijay', password:'123', buildings:['Wing A','Wing B','Wing C','Wing D','Wing E'].map(n=>B('marvel',n)).concat([B('marvel','Infra','Infra')])},
    {id:'miraya', name:'Miraya', clusterId:'dinesh', password:'123', buildings:['Wing A','Wing B','Wing C','Wing D'].map(n=>B('miraya',n)).concat([B('miraya','Infra','Infra')])},
    {id:'midas-city', name:'Midas City', clusterId:'vijay', password:'123', buildings:['Wing A','Wing B','Wing E','Wing F','Wing G'].map(n=>B('midas-city',n)).concat([B('midas-city','Infra','Infra')])},
    {id:'mithila-01', name:'Mithila-01', clusterId:'vijay', password:'123', buildings:[B('mithila-01','Wing A')]},
    {id:'shyni-gold', name:'Shyni Gold', clusterId:'', password:'123', buildings:[B('shyni-gold','Wing A/B')]},
    {id:'niyoshi-park', name:'Niyoshi Park', clusterId:'upendra', password:'123', buildings:[B('niyoshi-park','Wing A'), B('niyoshi-park','Infra','Infra')]}
  ]
};
const PCOL = ['#35546E','#067647','#B54708','#6941C6','#0E7490','#A21C4B','#4D7C0F','#7C2D12','#475467','#1D4ED8'];

/* ---------- storage: Claude artifact db → Vercel /api/store (Neon) → this browser ---------- */
const Store = {
  mode:'local', db:null, unsubs:[],
  async init(){
    if (window.claude && typeof window.claude.use === 'function'){
      try{
        const db = await Promise.race([window.claude.use('db'), new Promise(r=>setTimeout(()=>r(null),8000))]);
        if (db){ this.db = db; this.mode = 'cloud'; return; }
      }catch(e){}
    }
    if (location.protocol.startsWith('http')){
      try{
        const r = await fetch('api/store?col=app&id=config',{cache:'no-store'});
        if (r.ok && (r.headers.get('content-type')||'').includes('json')){ this.mode='api'; return; }
      }catch(e){}
    }
    this.mode='local';
  },
  lk(col,id){ return 'mip:'+col+':'+id },
  async get(col,id){
    if (this.mode==='cloud'){ const s = await this.db.doc(col+'/'+id).get(); return s.exists ? JSON.parse(JSON.stringify(s.data())) : null; }
    if (this.mode==='api'){ const r = await fetch(`api/store?col=${encodeURIComponent(col)}&id=${encodeURIComponent(id)}`,{cache:'no-store'}); const j = await r.json(); return j.data ?? null; }
    try{ const v = localStorage.getItem(this.lk(col,id)); return v ? JSON.parse(v) : null; }catch(e){ return null; }
  },
  async set(col,id,data){
    if (this.mode==='cloud'){ return this.db.doc(col+'/'+id).set(data); }
    if (this.mode==='api'){ const r = await fetch('api/store',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({col,id,data})}); if(!r.ok) throw new Error('Save failed ('+r.status+')'); return; }
    try{ localStorage.setItem(this.lk(col,id), JSON.stringify(data)); }catch(e){ throw new Error('This browser blocked local storage'); }
  },
  async del(col,id){
    if (this.mode==='cloud') return this.db.doc(col+'/'+id).delete();
    if (this.mode==='api'){ await fetch(`api/store?col=${encodeURIComponent(col)}&id=${encodeURIComponent(id)}`,{method:'DELETE'}); return; }
    try{ localStorage.removeItem(this.lk(col,id)); }catch(e){}
  },
  async list(col){
    if (this.mode==='cloud'){ const s = await this.db.collection(col).get(); return s.docs.map(d=>({id:d.id, data:JSON.parse(JSON.stringify(d.data()))})); }
    if (this.mode==='api'){ const r = await fetch(`api/store?col=${encodeURIComponent(col)}`,{cache:'no-store'}); const j = await r.json(); return j.docs || []; }
    const out=[]; try{ for (let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if (k.startsWith('mip:'+col+':')) out.push({id:k.slice(col.length+5), data:JSON.parse(localStorage.getItem(k))}); } }catch(e){}
    return out;
  },
  watch(onChange){
    if (this.mode==='cloud'){
      const safe = fn => (snap)=>{ try{ fn(snap) }catch(e){ console.error(e) } };
      this.unsubs.push(this.db.doc('app/config').onSnapshot(safe(s=>{ if(s.exists){ S.config = normConfig(JSON.parse(JSON.stringify(s.data()))); onChange('config'); } })));
      this.unsubs.push(this.db.collection('entries').onSnapshot(safe(s=>{ S.entries={}; s.docs.forEach(d=>S.entries[d.id]=JSON.parse(JSON.stringify(d.data()))); onChange('entries'); })));
      this.unsubs.push(this.db.doc('app/staff').onSnapshot(safe(s=>{ S.staff = s.exists ? (s.data().rows||[]).map(r=>({...r})) : []; onChange('staff'); })));
      this.unsubs.push(this.db.collection('incentives').onSnapshot(safe(s=>{ S.inc={}; s.docs.forEach(d=>S.inc[d.id]=JSON.parse(JSON.stringify(d.data()))); onChange('inc'); })));
    } else if (this.mode==='api'){
      setInterval(async()=>{ if (S.dirty || document.hidden) return; await loadAll(); onChange('poll'); }, 45000);
    }
  }
};
function normConfig(c){
  const d = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  c = c || d;
  c.settings = Object.assign({}, d.settings, c.settings||{});
  if (!Array.isArray(c.settings.slabs) || !c.settings.slabs.length) c.settings.slabs = d.settings.slabs;
  c.ceo = Object.assign({}, d.ceo, c.ceo||{});
  c.clusters = c.clusters || []; c.projects = c.projects || [];
  c.projects.forEach(p=>{ p.buildings = p.buildings||[]; });
  return c;
}

/* ---------- state ---------- */
const S = {
  config:null, entries:{}, staff:[], inc:{},
  user:null, view:null, month:null, week:1, approvedOnly:true, projectSel:null, dirty:false, meet:null

/* ---------- calendar: four reviews a month (1–7, 8–14, 15–21, 22–end) ---------- */
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MNL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthInfo(month){
  const [y,m] = month.split('-').map(Number); const dim = new Date(y,m,0).getDate();
  const weeks = [1,2,3,4].map(n=>{ const start=(n-1)*7+1, end = n<4 ? n*7 : dim; return {n,start,end,days:end-start+1}; });
  return {y,m,dim,weeks,label:MNL[m-1]+' '+y, short:MN[m-1]+' '+String(y).slice(2)};
}
function fyMonths(month){ // Apr..Mar of the FY containing month
  const [y,m] = month.split('-').map(Number); const fy = m>=4 ? y : y-1;
  return Array.from({length:12},(_,i)=>{ const mm=(3+i)%12+1, yy= i<9?fy:fy+1; return yy+'-'+String(mm).padStart(2,'0'); });
}
function fyLabel(month){ const [y,m]=month.split('-').map(Number); const fy=m>=4?y:y-1; return 'FY'+fy+'-'+String(fy+1).slice(2); }
function todayMonth(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function todayWeek(){ const d=new Date().getDate(); return d<=7?1:d<=14?2:d<=21?3:4; }

/* ---------- numbers ---------- */
const nf = new Intl.NumberFormat('en-IN',{maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
const fmt = v => (v==null||isNaN(v)) ? '–' : nf.format(v);
const rs = v => (v==null||isNaN(v)) ? '–' : '₹'+nf0.format(Math.round(v));
const pctS = v => (v==null||!isFinite(v)) ? '–' : (Math.round(v*10)/10).toFixed(1)+'%';
const thr = () => +S.config.settings.threshold || 80;
const tone = p => (p==null||!isFinite(p)) ? 'none' : p>=thr() ? 'good' : p>=thr()*0.75 ? 'watch' : 'risk';
const pctChip = p => `<span class="pct ${tone(p)}">${pctS(p)}</span>`;
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v).replace(/,/g,'')); return isFinite(n)?n:0; };

/* ---------- lookups ---------- */
const proj = id => S.config.projects.find(p=>p.id===id);
const cluster = id => S.config.clusters.find(c=>c.id===id);
const entryId = (month,pid) => month+'_'+pid;
function getEntry(month,pid){
  return S.entries[entryId(month,pid)] || {month, projectId:pid, targets:{}, weeks:{}};
}
const wk = (e,n) => (e.weeks && e.weeks[n]) || {vals:{}, status:'draft'};
function visibleProjects(){
  const u=S.user; if(!u) return [];
  if (u.role==='ceo') return S.config.projects;
  if (u.role==='cluster') return S.config.projects.filter(p=>p.clusterId===u.id);
  return S.config.projects.filter(p=>p.id===u.id);
}
function includeStatus(st, mode){
  if (mode==='approved') return st==='approved';
  if (mode==='submitted') return st==='approved'||st==='submitted';
  return st==='approved'||st==='submitted'||st==='draft'||st==='returned';
}
function viewMode(){
  if (!S.user) return 'approved';
  if (S.user.role==='project') return 'all';
  if (S.user.role==='cluster') return S.approvedOnly ? 'approved' : 'submitted';
  return S.approvedOnly ? 'approved' : 'submitted';
}

/* ---------- core calculation ---------- */
function calcProject(pid, month, mode){
  const p = proj(pid); const mi = monthInfo(month); const e = getEntry(month,pid);
  const blds = p.buildings.map(b=>({id:b.id,name:b.name,kind:b.kind,target:num(e.targets?.[b.id]),weeks:[],mtd:0}));
  const weeks = mi.weeks.map(w=>{
    const W = wk(e,w.n); const inc = includeStatus(W.status||'draft', mode) && Object.keys(W.vals||{}).length>0;
    let t=0,a=0;
    blds.forEach(b=>{ const v = W.vals?.[b.id]||{}; const bt = v.t!=null&&v.t!=='' ? num(v.t) : (b.target*w.days/mi.dim); const ba = num(v.a);
      b.weeks.push({t:bt, a:inc?ba:null, raw:ba}); if (inc){ b.mtd += ba; } t+=bt; a+=ba; });
    return {...w, status:W.status||'draft', hasData:Object.keys(W.vals||{}).length>0, included:inc, t, a:inc?a:null, rawA:a, note:W.note||'', by:W.approvedBy||'', at:W.approvedAt||W.submittedAt||''};
  });
  const target = blds.reduce((s,b)=>s+b.target,0);
  let cumA=0, cumT=0, lastIdx=-1;
  weeks.forEach((w,i)=>{ cumT += w.t; w.cumT = cumT; if (w.included){ cumA += w.a; lastIdx=i; } w.cumA = w.included ? cumA : null;
    w.weekPct = w.included && w.t>0 ? w.a/w.t*100 : null;
    w.cumPct = w.included && target>0 ? cumA/target*100 : null;
    w.projRR = w.included && target>0 ? (cumA/w.end*mi.dim)/target*100 : null;
    w.projMom = w.included && target>0 ? (cumA + (w.a/w.days)*(mi.dim-w.end))/target*100 : null;
  });
  blds.forEach(b=>{ b.pct = b.target>0 ? b.mtd/b.target*100 : null; b.share = cumA>0 ? b.mtd/cumA*100 : 0; });
  const last = lastIdx>=0 ? weeks[lastIdx] : null;
  const daysDone = last ? last.end : 0; const remWeeks = 4-(lastIdx+1);
  const need80 = Math.max(0, target*thr()/100 - cumA);
  const need100 = Math.max(0, target - cumA);
  const pct = target>0 && last ? cumA/target*100 : null;
  const planPace = last && last.cumT>0 ? cumA/last.cumT*100 : null;
  const prev = lastIdx>0 ? weeks[lastIdx-1] : null;
  return {p, pid, month, mi, e, blds, weeks, target, mtd:cumA, pct, last, lastIdx, daysDone, remWeeks,
    projRR: last?last.projRR:null, projMom: last?last.projMom:null, planPace,
    perWeek80: remWeeks>0 ? need80/remWeeks : null, need80, need100,
    avgWeekA: lastIdx>=0 ? cumA/(lastIdx+1) : null, lastWeekA: last?last.a:null, prevWeekPct: prev?prev.weekPct:null};
}
function calcPortfolio(pids, month, mode){
  const list = pids.map(id=>calcProject(id,month,mode));
  const target = list.reduce((s,c)=>s+c.target,0);
  const withData = list.filter(c=>c.last);
  const mtd = list.reduce((s,c)=>s+c.mtd,0);
  const projAbs = list.reduce((s,c)=>s+(c.projRR!=null?c.projRR*c.target/100:0),0);
  const lastIdx = Math.max(-1,...list.map(c=>c.lastIdx));
  const weeks = [0,1,2,3].map(i=>{ let a=0,t=0,inc=false; list.forEach(c=>{ const w=c.weeks[i]; t+=w.t; if(w.included){a+=w.a;inc=true;} }); return {n:i+1,a:inc?a:null,t}; });
  return {list, target, mtd, pct: target>0&&withData.length ? mtd/target*100 : null, projRR: target>0&&withData.length ? projAbs/target*100 : null, lastIdx, weeks, withData};
}
function slabPct(p){ if (p==null) return 0; let best=0; S.config.settings.slabs.slice().sort((a,b)=>a.min-b.min).forEach(s=>{ if (p>=+s.min) best=+s.pct; }); return best; }
function pendingFor(user){
  const out=[]; const months = new Set(Object.values(S.entries).map(e=>e.month));
  months.forEach(m=>{ S.config.projects.forEach(p=>{
    if (user.role==='cluster' && p.clusterId!==user.id) return;
    const e = S.entries[entryId(m,p.id)]; if(!e) return;
    Object.keys(e.weeks||{}).forEach(n=>{ if (e.weeks[n].status==='submitted') out.push({month:m,pid:p.id,n:+n,at:e.weeks[n].submittedAt}); });
  }); });
  return out.sort((a,b)=>(a.month+a.n).localeCompare(b.month+b.n));
}
/* ---------- charts (plain SVG) ---------- */
function lineChart({series, labels, ref, height=270}){
  const W=760,H=height,L=40,R=120,T=16,Bt=28, iw=W-L-R, ih=H-T-Bt;
  let maxV = Math.max(110, ...series.flatMap(s=>s.points.concat([s.proj]).filter(v=>v!=null)));
  maxV = Math.ceil(maxV/25)*25;
  const x = i => L + i*(iw/(labels.length-1)); const y = v => T+ih - Math.min(v,maxV)/maxV*ih;
  let g='';
  for (let v=0; v<=maxV; v+=25){ g+=`<line x1="${L}" x2="${L+iw}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-2)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}%</text>`; }
  labels.forEach((l,i)=> g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`);
  if (ref!=null) g+=`<line x1="${L}" x2="${L+iw}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--brand)" stroke-width="1.5"/><circle cx="${L}" cy="${y(ref)}" r="4" fill="var(--brand)"/><text x="${L+8}" y="${y(ref)-6}" style="fill:var(--brand);font-weight:700">Incentive line ${ref}%</text>`;
  const ends=[];
  series.forEach(s=>{
    const pts = s.points.map((v,i)=>v==null?null:[x(i),y(v)]); let d=''; let lastPt=null, lastI=-1;
    pts.forEach((p,i)=>{ if(!p) return; d += (d?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); lastPt=p; lastI=i; });
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
    pts.forEach(p=>{ if(p) g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${s.color}"/>`; });
    if (s.proj!=null && lastPt && lastI<labels.length-1){
      const px=x(labels.length-1), py=y(s.proj);
      g+=`<path d="M${lastPt[0]} ${lastPt[1]}L${px} ${py}" stroke="${s.color}" stroke-width="2" stroke-dasharray="5 5" fill="none" opacity=".8"/><circle cx="${px}" cy="${py}" r="4" fill="var(--surface)" stroke="${s.color}" stroke-width="2"/>`;
      ends.push({y:py,c:s.color,t:s.name+' '+Math.round(s.proj)+'%'});
    } else if (lastPt){ ends.push({y:lastPt[1],c:s.color,t:s.name+' '+Math.round(s.points[lastI])+'%'}); }
  });
  ends.sort((a,b)=>a.y-b.y); let prevY=-99; ends.forEach(e=>{ const yy=Math.max(e.y+4, prevY+13); prevY=yy; g+=`<text x="${L+iw+8}" y="${yy}" style="fill:${e.c};font-weight:650">${esc(e.t)}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative achievement by week">${g}</svg></div>`;
}
function barChart({groups, labels, ref, pctMode=false, height=240, colors=['var(--steel-2)','var(--steel)']}){
  // groups: [{label, values:[v1,v2]}]
  const W=760,H=height,L=pctMode?40:64,R=16,T=16,Bt=30, iw=W-L-R, ih=H-T-Bt;
  let maxV = Math.max(pctMode?110:1, ...groups.flatMap(g=>g.values.filter(v=>v!=null)));
  const step = pctMode?25:niceStep(maxV/4); maxV = Math.ceil(maxV/step)*step || 1;
  const y = v => T+ih - v/maxV*ih; const gw = iw/groups.length; const nb = groups[0]?.values.length||1; const bw = Math.min(34,(gw*0.7)/nb);
  let g='';
  for (let v=0; v<=maxV+1e-9; v+=step){ g+=`<line x1="${L}" x2="${L+iw}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-2)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${pctMode?Math.round(v)+'%':shortNum(v)}</text>`; }
  groups.forEach((gr,i)=>{
    const cx = L + gw*i + gw/2; const x0 = cx - bw*nb/2;
    gr.values.forEach((v,j)=>{ if (v==null) return; const col = typeof colors[j]==='function'?colors[j](v):colors[j]; g+=`<rect x="${x0+j*bw+1}" y="${y(Math.max(v,0))}" width="${bw-2}" height="${Math.max(0,ih-(y(Math.max(v,0))-T))}" rx="2" fill="${col}"><title>${esc(gr.label)}: ${pctMode?pctS(v):fmt(v)}</title></rect>`;
      if (pctMode) g+=`<text x="${x0+j*bw+bw/2}" y="${y(Math.max(v,0))-4}" text-anchor="middle" style="font-weight:650;fill:var(--ink)">${Math.round(v)}%</text>`; });
    g+=`<text x="${cx}" y="${H-9}" text-anchor="middle">${esc(gr.label)}</text>`;
  });
  if (ref!=null) g+=`<line x1="${L}" x2="${L+iw}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--brand)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">${g}</svg></div>`;
}
function niceStep(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function shortNum(v){ return v>=1e7?(v/1e7).toFixed(1)+'Cr':v>=1e5?(v/1e5).toFixed(1)+'L':v>=1e3?(v/1e3).toFixed(1)+'k':String(Math.round(v*100)/100); }

/* ---------- the signature: the incentive line board ---------- */
function board(pf){
  const max=120, pos=v=>Math.max(0,Math.min(v,max))/max*100;
  const ticks=[0,20,40,60,80,100,120].map(v=>`<span style="left:${pos(v)}%">${v}%</span>`).join('');
  const lanes = pf.list.map(c=>{
    const fill = c.pct!=null ? `<div class="fill ${c.pct>=thr()?'good':''}" style="width:${pos(c.pct)}%"></div>` : '';
    const pj = c.projRR!=null ? `<div class="proj" style="left:${pos(c.projRR)}%" title="Projected month end ${pctS(c.projRR)}"></div>` : '';

    return `<div class="lane"><div class="name">${esc(c.p.name)}<small>${c.last?('Through W'+c.last.n+' · '):''}${esc(cl?cl.name.split(' ')[0]:'CEO approves')}</small></div>
      <div class="track">${fill}${pj}<div class="line" style="left:${pos(thr())}%"></div></div>
      <div class="fig"><b style="color:var(--${tone(c.pct)==='none'?'ink-3':tone(c.pct)})">${pctS(c.pct)}</b><span>${c.projRR!=null?'heading to '+pctS(c.projRR):'no figures yet'}</span></div></div>`;
  }).join('');
  return `<div class="board">${lanes}</div><div class="axis"><div></div><div class="ticks">${ticks}</div><div></div></div>

}

/* ---------- incentive engine ---------- */
function findProject(name){
  const k = slug(name).replace(/-/g,''); if(!k) return null;
  return S.config.projects.find(p=> slug(p.name).replace(/-/g,'')===k || p.id.replace(/-/g,'')===k) || null;
}
const isYes = v => /^(y|yes|true|1|✓)$/i.test(String(v??'').trim());
const isNo = v => /^(n|no|false|0|-|na|n\/a)?$/i.test(String(v??'').trim());
function allocation(r){
  if (!isNo(r.dedicated)){
    const name = isYes(r.dedicated) ? r.location : r.dedicated; const p = findProject(name);
    return {type:'Dedicated', alloc: p?[{pid:p.id,share:100}]:[], issue: p?'':`Project "${name}" not found`};
  }
  if (!isNo(r.shared)){
    let parts;
    if (isYes(r.shared) || /^all$/i.test(String(r.shared).trim())) parts = S.config.projects.map(p=>({pid:p.id,share:null}));
    else parts = String(r.shared).split(/[,;|]+/).map(x=>x.trim()).filter(Boolean).map(x=>{
      let p = findProject(x); if (p) return {pid:p.id, share:null};
      const m = x.match(/^(.*?)\s*[:=(]\s*(\d+(?:\.\d+)?)\s*%?\s*\)?$/) || x.match(/^(.*?)\s+(\d+(?:\.\d+)?)\s*%$/);
      if (m){ p = findProject(m[1]); return {pid:p?.id, share:+m[2], raw:m[1]}; }
      return {pid:null, raw:x};
    });
    const bad = parts.filter(x=>!x.pid).map(x=>x.raw); parts = parts.filter(x=>x.pid);
    const fixed = parts.filter(x=>x.share!=null).reduce((s,x)=>s+x.share,0); const open = parts.filter(x=>x.share==null);
    const rest = Math.max(0,100-fixed); open.forEach(x=>x.share = rest/open.length);
    const tot = parts.reduce((s,x)=>s+x.share,0); if (tot>100.01) parts.forEach(x=>x.share = x.share*100/tot);
    return {type:'Shared', alloc:parts, issue: bad.length?('Not found: '+bad.join(', ')):''};
  }
  return {type:'Not tagged', alloc:[], issue:'Mark Dedicated or Shared'};
}
function baseOf(r){ return S.config.settings.base==='ctc' ? num(r.ctcMonth) : num(r.gross); }
function incentiveRun(month){
  const pf = calcPortfolio(S.config.projects.map(p=>p.id), month, 'approved');
  const pmap = {}; pf.list.forEach(c=>pmap[c.pid]={c, earnPct:slabPct(c.pct), projPct:slabPct(c.projRR)});
  const ov = (S.inc[month]||{}).overrides||{};
  const rows = S.staff.map(r=>{
    const a = allocation(r); const base = baseOf(r);
    let earned=0, projected=0; const lines = a.alloc.map(x=>{ const q=pmap[x.pid]; const e = base*x.share/100*(q?q.earnPct:0)/100; const pr = base*x.share/100*(q?q.projPct:0)/100; earned+=e; projected+=pr; return {...x, e, pr}; });
    const o = ov[r.id]; const final = (o && o.amt!=null && o.amt!=='') ? num(o.amt) : earned;
    return {...r, ...a, base, lines, earned, projected, override:o, final};
  });
  const byProject = {}; S.config.projects.forEach(p=>byProject[p.id]={earned:0,projected:0,heads:0,fte:0});
  rows.forEach(r=>r.lines.forEach(l=>{ const b=byProject[l.pid]; if(!b) return; b.earned+=l.e; b.projected+=l.pr; b.heads++; b.fte+=l.share/100; }));
  return {pf, pmap, rows, byProject, total: rows.reduce((s,r)=>s+r.final,0), projected: rows.reduce((s,r)=>s+r.projected,0)};
}

/* ---------- CHRO / variable-pay interpretation ---------- */
function insightsFor(pf, opts={}){
  const out=[]; const T=thr(); const unit=S.config.settings.unit; const L=pf.list;
  const act = L.filter(c=>c.last);
  if (!act.length){ out.push({tone:'info', h:'Nothing to read yet', p:'No figures have come through for this month in the current view.', a:'Ask project representatives to submit Week 1, and cluster heads to approve it before the meeting.'}); return out; }
  const wkN = Math.max(...act.map(c=>c.last.n));
  // portfolio headline
  const gap = pf.projRR!=null ? pf.projRR - T : null;
  out.push({tone: pf.projRR>=T?'good':pf.projRR>=T*0.85?'watch':'risk',
    h:`${opts.label||'Portfolio'} at ${pctS(pf.pct)} after Week ${wkN}, heading to ${pctS(pf.projRR)}`,
    p:`At the current run rate ${opts.label?'the project':'the portfolio'} closes ${gap>=0?pctS(gap).replace('%',' points')+' above':pctS(-gap).replace('%',' points')+' below'} the ${T}% incentive line. The month is ${Math.round(Math.max(...act.map(c=>c.daysDone))/act[0].mi.dim*100)}% elapsed; achievement is ${pctS(pf.pct)} of target.`,
    a: gap>=0 ? 'Hold pace; use the meeting to push qualified projects towards 100% rather than coasting at the line.' : 'Spend the meeting on the at-risk projects below; the portfolio will not qualify on current momentum.'});
  // classification
  const qualified = act.filter(c=>c.pct>=T), onCourse = act.filter(c=>c.pct<T && c.projRR>=T);
  const recover = act.filter(c=>c.projRR<T && c.remWeeks>0 && c.perWeek80!=null && c.avgWeekA>0 && c.perWeek80 <= c.avgWeekA*1.5);
  const risk = act.filter(c=>c.projRR<T && !recover.includes(c) && c.pct<T);
  if (qualified.length) out.push({tone:'good', h:`Already above the line: ${qualified.map(c=>c.p.name).join(', ')}`, p:qualified.map(c=>`${c.p.name} ${pctS(c.pct)}`).join(' · ')+'. On the figures shown, these teams are already past the incentive line for the month.', a:'Recognise publicly in the meeting. Watch for teams easing off once the line is crossed; set a stretch at 100%.'});
  if (onCourse.length) out.push({tone:'good', h:`On course to qualify: ${onCourse.map(c=>c.p.name).join(', ')}`, p:onCourse.map(c=>`${c.p.name} at ${pctS(c.pct)}, projected ${pctS(c.projRR)}`).join('; ')+'.', a:'No intervention needed. Confirm next week\'s plan covers the remaining '+onCourse.map(c=>`${fmt(c.need80)} ${unit} (${c.p.name})`).join(', ')+'.'});
  recover.forEach(c=> out.push({tone:'watch', h:`${c.p.name} is recoverable`, p:`Projected ${pctS(c.projRR)}. To reach ${T}% it needs ${fmt(c.perWeek80)} ${unit} a week for the remaining ${c.remWeeks} week${c.remWeeks>1?'s':''}, against an average of ${fmt(c.avgWeekA)} so far (${Math.round(c.perWeek80/c.avgWeekA*100)}% of current pace).`, a:`Ask ${cluster(c.p.clusterId)?.name||'the project head'} for a building-wise recovery plan with named owners before the next review.`}));
  risk.forEach(c=>{
    const why = c.remWeeks===0 ? 'The month is fully reported.' : c.avgWeekA>0 ? `It would need ${fmt(c.perWeek80)} ${unit} a week, ${Math.round(c.perWeek80/c.avgWeekA*100)}% of its current weekly pace.` : 'No achievement has been recorded yet.';
    out.push({tone:'risk', h:`${c.p.name} is unlikely to qualify this month`, p:`At ${pctS(c.pct)} with a projection of ${pctS(c.projRR)}. ${why}`, a: c.remWeeks===0 ? 'Close the month honestly and review root cause (approvals, material, manpower, labour) rather than re-cutting the target.' : 'Escalate in this meeting: fix the constraint (material, contractor manpower, approvals) or agree now that this month is a miss and protect next month\'s plan.'});
  });
  // cliff effect
  const cliff = act.filter(c=>c.projRR!=null && c.projRR>=T-10 && c.projRR<T);
  if (cliff.length) out.push({tone:'watch', h:'Incentive cliff in play', p:`${cliff.map(c=>c.p.name).join(', ')} ${cliff.length>1?'are':'is'} projected within 10 points of ${T}%. Under a single ${T}% gate, ${T-1}% pays nothing and ${T}% pays the full ${slabPct(T)}%, which invites end-of-month bunching and pressure on figures.`, a:'Verify the last week\'s figures with extra care. For the next cycle consider a graded slab (for example 70–79% paying a partial rate) in Settings.'});
  // momentum
  act.forEach(c=>{ if (c.lastIdx<1) return; const now=c.last.weekPct, prev=c.prevWeekPct; if (now==null||prev==null) return;
    if (now < prev-20) out.push({tone:'watch', h:`${c.p.name} slowed in Week ${c.last.n}`, p:`Weekly delivery fell from ${pctS(prev)} to ${pctS(now)} of the week's target. The run-rate projection still carries earlier weeks; the momentum view puts month end at ${pctS(c.projMom)}.`, a:'Ask what changed this week before it becomes the trend.'});
    else if (now > prev+20) out.push({tone:'good', h:`${c.p.name} accelerated in Week ${c.last.n}`, p:`Weekly delivery rose from ${pctS(prev)} to ${pctS(now)} of target. If this pace holds, month end is ${pctS(c.projMom)}.`, a:'Find out what unlocked it and whether it can be repeated on other sites.'}); });
  // concentration + stalled buildings + infra lag
  act.forEach(c=>{
    const real = c.blds.filter(b=>b.target>0);
    const top = real.slice().sort((a,b)=>b.share-a.share)[0];
    if (real.length>=3 && top && top.share>=55) out.push({tone:'watch', h:`${c.p.name} depends on ${top.name}`, p:`${top.name} delivered ${Math.round(top.share)}% of the project's achievement so far. The other ${real.length-1} buildings are carrying little of the load.`, a:'Check whether the other buildings are blocked or simply de-prioritised.'});
    const stalled = real.filter(b=>b.mtd===0 && c.lastIdx>=1);
    if (stalled.length) out.push({tone:'risk', h:`${c.p.name}: ${stalled.map(b=>b.name).join(', ')} at zero`, p:`${stalled.length>1?'These buildings have':'This building has'} a target of ${fmt(stalled.reduce((s,b)=>s+b.target,0))} ${unit} and no achievement after ${c.lastIdx+1} weeks.`, a:'Confirm whether the target is still valid; if the site is on hold, move the target so the project is measured fairly.'});
    const infra = real.filter(b=>b.kind==='Infra'), bl = real.filter(b=>b.kind!=='Infra');
    if (infra.length && bl.length){ const ip = infra.reduce((s,b)=>s+b.mtd,0)/infra.reduce((s,b)=>s+b.target,0)*100; const bp = bl.reduce((s,b)=>s+b.mtd,0)/bl.reduce((s,b)=>s+b.target,0)*100;
      if (isFinite(ip)&&isFinite(bp)&&bp-ip>=25) out.push({tone:'watch', h:`${c.p.name}: infra trailing the buildings`, p:`Infra is at ${pctS(ip)} against ${pctS(bp)} for buildings. Infra lag usually shows up later as possession and OC delays.`, a:'Give infra its own owner and weekly line item in the review.'}); }
    if (c.pct!=null && c.pct>=125) out.push({tone:'info', h:`${c.p.name} is far above target`, p:`${pctS(c.pct)} of the month's target. Sustained over-achievement of this size usually means the target was set low.`, a:'Review how next month\'s target is set so the incentive rewards stretch, not a soft plan.'});
    const wt = c.weeks.map(w=>w.t); const tot = wt.reduce((a,b)=>a+b,0);
    if (tot>0 && wt[3]/tot>0.4) out.push({tone:'watch', h:`${c.p.name}'s plan is back-loaded`, p:`${Math.round(wt[3]/tot*100)}% of the weekly targets sit in Week 4. Back-loaded plans rarely recover if Week 4 slips.`, a:'Ask for a flatter weekly plan next month.'});
  });
  // approvals
  if (opts.pending){ const pend = pendingFor(S.user); if (pend.length){ const oldest = pend.reduce((m,x)=>Math.min(m,x.at?new Date(x.at).getTime():Date.now()),Date.now()); const days = Math.floor((Date.now()-oldest)/864e5);
    out.push({tone:'watch', h:`${pend.length} weekly submission${pend.length>1?'s':''} awaiting approval`, p:`Oldest waiting ${days} day${days===1?'':'s'}. Unapproved figures are excluded from this dashboard and from incentive.`, a:'Cluster heads should approve or return before the meeting starts.'}); } }
  // incentive exposure
  if (opts.incentive && S.staff.length){ const run = incentiveRun(pf.list[0].month); 
    const atStake = recover.concat(cliff.filter(c=>!recover.includes(c))).reduce((s,c)=>s+ (run.rows.reduce((t,r)=>t+r.lines.filter(l=>l.pid===c.pid).reduce((u,l)=>u+r.base*l.share/100*slabPct(T)/100,0),0)),0);
    out.push({tone:'info', h:`Incentive outlook: ${rs(run.total)} earned, ${rs(run.projected)} projected`, p:`Earned uses approved figures to date; projected assumes each project closes at its run rate.${atStake>0?` A further ${rs(atStake)} depends on the recoverable and near-line projects.`:''}`, a:'Use the at-stake figure when asking project teams for their recovery commitment.'}); }
  return out;
}

function projectBody(c, compact=false){

  h += `<div class="grid2"><section class="panel"><div class="panel-head"><h2>Weekly target and achievement</h2><span class="legend" style="margin:0"><span><i style="width:10px;height:10px;background:var(--steel-2)"></i>Target</span><span><i style="width:10px;height:10px;background:var(--steel)"></i>Achieved</span></span></div>${c.target>0?barChart({groups}):emptyHTML('No target set','')}
    ${c.last?lineChart({series:[{name:c.p.name,color:'var(--steel)',points:[0,...c.weeks.map(w=>w.cumPct)],proj:c.projRR}],labels:['Start','W1','W2','W3','W4'],ref:thr(),height:230}):''}</section>

async function persistEntry(action){
  const p=proj(S.projectSel); const e = JSON.parse(JSON.stringify(getEntry(S.month,p.id))); const n=S.week; const mi=monthInfo(S.month);

async function uploadStaff(file){

    const rows = XLSX.utils.sheet_to_json(ws,{defval:''});

    const out = rows.map((r,i)=>{ const o={}; const keys=Object.keys(r); Object.entries(map).forEach(([k,al])=>{ const hit=keys.find(x=>al.includes(norm(x))); o[k]= hit!=null? r[hit] : ''; });
      ['gross','ctcYear','ctcMonth'].forEach(k=>o[k]=num(o[k])); ['name','designation','department','dedicated','shared','location'].forEach(k=>o[k]=String(o[k]).trim());

    case 'saveDraft': persistEntry('draft'); break;
    case 'submitWeek': persistEntry('submit'); break;
    case 'reopen': { const e=JSON.parse(JSON.stringify(getEntry(S.month,S.projectSel))); const W=e.weeks[S.week]; if(!W) break; W.status='draft'; (W.log||=[]).push({at:new Date().toISOString(),by:'CEO',action:'reopened'}); await saveEntry(e); toast('Reopened as draft'); render(); break; }
    case 'decide': decide(b.dataset.k, b.dataset.d); break;
    case 'exportSummary': exportSummary(); break;
    case 'exportIncentive': exportIncentive(); break;
    case 'template': downloadTemplate(); break;
    case 'delStaff': S.staff = S.staff.filter(r=>r.id!==b.dataset.id); await Store.set('app','staff',{rows:S.staff}); render(); break;
    case 'clearStaff': if (await ask('Remove all staff?','The incentive register will be empty until you upload again.','Remove all',true)){ S.staff=[]; await Store.set('app','staff',{rows:[]}); render(); } break;
    case 'addProject': { const name=$('#npName').value.trim(); if(!name) return toast('Enter a project name'); if (c.projects.some(p=>slug(p.name)===slug(name))) return toast('A project with that name exists');
      let id=slug(name); while(c.projects.some(p=>p.id===id)) id+='-2';
      const bl = $('#npBld').value.split(',').map(s=>s.trim()).filter(Boolean).map(n=>B(id,n)); if ($('#npInfra').checked) bl.push(B(id,'Infra','Infra'));
      c.projects.push({id,name,clusterId:$('#npCl').value,password:'123',buildings:bl}); await saveConfig(`${name} created · login "${name}", password 123`); render(); break; }
    case 'delProject': { const p=proj(b.dataset.p); if (await ask(`Delete ${p.name}?`,'The project, its buildings and its login are removed. Past figures stay in storage but no longer show.','Delete project',true)){ c.projects=c.projects.filter(x=>x.id!==p.id); await saveConfig('Project deleted'); render(); } break; }
    case 'addBld': { const p=proj(b.dataset.p); const inp=$('#nb-'+p.id); const name=inp.value.trim(); if(!name) return toast('Enter a building name'); let nb=B(p.id,name,$('#nk-'+p.id).value); while(p.buildings.some(x=>x.id===nb.id)) nb.id+='-2'; p.buildings.push(nb); await saveConfig(`${name} added to ${p.name}`); render(); break; }
    case 'delBld': { const p=proj(b.dataset.p); const bl=p.buildings.find(x=>x.id===b.dataset.b); if (await ask(`Remove ${bl.name} from ${p.name}?`,'Its figures will no longer count in totals.','Remove',true)){ p.buildings=p.buildings.filter(x=>x.id!==bl.id); await saveConfig('Building removed'); render(); } break; }
    case 'addCluster': { const name=$('#ncName').value.trim(); if(!name) return toast('Enter a name'); let id=slug(name); while(c.clusters.some(x=>x.id===id)) id+='-2'; c.clusters.push({id,name,password:'123'}); await saveConfig(`${name} added · password 123`); render(); break; }
    case 'delCluster': { const k=cluster(b.dataset.c); if (await ask(`Remove ${k.name}?`,'Their projects move to CEO approval until you assign another cluster head.','Remove',true)){ c.clusters=c.clusters.filter(x=>x.id!==k.id); c.projects.forEach(p=>{ if(p.clusterId===k.id) p.clusterId=''; }); await saveConfig('Cluster head removed'); render(); } break; }
    case 'addSlab': { const mx=Math.max(...c.settings.slabs.map(s=>+s.min)); c.settings.slabs.push({min:Math.min(mx+20,150),pct:+c.settings.slabs[c.settings.slabs.length-1].pct+5}); await saveConfig('Slab added'); render(); break; }
    case 'delSlab': c.settings.slabs.splice(+b.dataset.i,1); await saveConfig('Slab removed'); render(); break;
    case 'demo': loadDemo(); break;
    case 'wipe': wipeAll(); break;
  }
});
document.addEventListener('change', async ev=>{
  const t=ev.target; const k=t.dataset.chg; if(!k || !$('#app').contains(t)) return; const c=S.config; const v=t.value;
  const P = ()=>proj(t.dataset.p), Bd = ()=>proj(t.dataset.p).buildings.find(x=>x.id===t.dataset.b), K=()=>cluster(t.dataset.c);
  switch(k){
    case 'month': if (S.view==='entry' && S.dirty && !(await ask('Leave without saving?','Your changes on this week are not saved yet.','Leave'))){ t.value=S.month; break; } S.dirty=false; S.month=v; render(); break;
    case 'projectSel': S.dirty=false; S.projectSel=v; render(); break;
    case 'upload': if (t.files[0]) uploadStaff(t.files[0]); t.value=''; break;
    case 'ovr': setOverride(t.dataset.id, v.trim()); break;
    case 'pName': if(!v.trim()) return render(); P().name=v.trim(); await saveConfig('Renamed'); break;
    case 'pCl': P().clusterId=v; await saveConfig('Cluster head updated'); render(); break;
    case 'pPw': if(!v.trim()) return render(); P().password=v.trim(); await saveConfig('Password updated'); break;
    case 'bName': if(!v.trim()) return render(); Bd().name=v.trim(); await saveConfig('Renamed'); break;
    case 'bKind': Bd().kind=v; await saveConfig('Updated'); break;
    case 'cName': if(!v.trim()) return render(); K().name=v.trim(); await saveConfig('Renamed'); render(); break;
    case 'cPw': if(!v.trim()) return render(); K().password=v.trim(); await saveConfig('Password updated'); break;
    case 'thr': { const n=num(v); if(n<=0||n>200) return render(); c.settings.threshold=n; if (c.settings.slabs.length===1) c.settings.slabs[0].min=n; await saveConfig('Incentive line updated'); render(); break; }
    case 'base': c.settings.base=v; await saveConfig('Updated'); render(); break;
    case 'unit': c.settings.unit=v.trim()||'₹ Lakhs'; await saveConfig('Units updated'); break;
    case 'slabMin': c.settings.slabs[+t.dataset.i].min=num(v); await saveConfig('Slab updated'); render(); break;
    case 'slabPct': c.settings.slabs[+t.dataset.i].pct=num(v); await saveConfig('Slab updated'); render(); break;
    case 'ceoPw': if(!v.trim()) return render(); c.ceo.password=v.trim(); await saveConfig('CEO password updated'); break;
  }
});
document.addEventListener('input', ev=>{ const t=ev.target; if(!t.dataset.in) return; S.dirty=true; if (t.dataset.in==='t') t.dataset.auto = t.value===''?'1':'0'; updateEntryCalc(); });

/* ---------- boot ---------- */
(async function boot(){
  $('#app').innerHTML = `<div class="login-wrap"><div class="muted">Loading figures…</div></div>`;
  await Store.init(); try{ await loadAll(); }catch(e){ S.config = normConfig(null); }
  S.month = todayMonth(); S.week = todayWeek();
  try{ const u=JSON.parse(sessionStorage.getItem('mip:user')||'null'); if(u){ const rec = u.role==='ceo'?S.config.ceo:u.role==='cluster'?cluster(u.id):proj(u.id); if(rec){ S.user={role:u.role,id:u.id,name:u.role==='ceo'?'CEO':rec.name}; S.view=u.role==='project'?'entry':u.role==='cluster'?'approvals':'dashboard'; S.projectSel=u.role==='project'?u.id:visibleProjects()[0]?.id; } } }catch(e){}
  let t=null;
  Store.watch(()=>{ clearTimeout(t); t=setTimeout(()=>{ if (!S.user) return renderLogin(); if (S.view==='entry' && S.dirty) return; if (document.querySelector('#dlg[open]')) return; if (S.meet) return renderMeet(); if (document.activeElement && document.activeElement.matches('input,select,textarea') && $('#app').contains(document.activeElement)) return; render(); }, 250); });
  render();
})();
</script>
